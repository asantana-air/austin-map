rom Taco Deli (another Austin favorite) and good bakery snacks too. If you don't love cold brew, they have all the other coffee options too! "]}, {"name": "drink.well.", "neighborhood": "Central Austin", "google_place_id": "ChIJc262qWzKRIYRxo9PBUampxk", "lat": 30.317235946655273, "lng": -97.72053527832031, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1380, "recommending_guidebooks": 117, "total_guidebooks": 2034, "blurbs": ["Modern drinks and casual pub fare in a cozy space. drink.well. is a model neighborhood bar: pitch-perfect cocktail menus season after season and solid food options in a cozy atmosphere. This season’s menu offers fresh and unique offerings like the Well Healed, a blend of blanco tequila, Espadín mezcal, fresh celery, Chareau Aloe liqueur, and lime. Unlike a lot of “bar fare,” you can pop in for dinner and actually leave satisfied; try the delicious 44 Farms burger and frites (house-made brioche b", "Wonderful cocktails!  Often a contender in Austin's annual cocktail competition drink well has a craft cocktails, a good happy hour and over 50 types of Whiskey.   - all day happy hour sunday - can get packed quickly  - a close walk from the guesthouse - they have a rotating house made twinkie. :) ", "This is a good place when you are in the mood for a fancy drink that is not annoying. I would highly recommend the \"Royale with Ease\" I feel like I am on vacation when I drink it. This is about a 20 minute walk through the neighborhood- no big deal. "]}, {"name": "Sawyer & Co", "neighborhood": "East Austin", "google_place_id": "ChIJD0B3uSu0RIYRjyLH4OTZI2k", "lat": 30.25138282775879, "lng": -97.70182037353516, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1364, "recommending_guidebooks": 125, "total_guidebooks": 2431, "blurbs": ["Take a step back into 1960s Austin in this ultra cool retro creole-american fusion diner. A perfect brunch spot located in Far East Austin on old Cesar Chavez. I usually get the Crab Eggs Benedict but their menu options are vast and varied. DON'T miss their home made biscuits. ", "Sawyer is a great place for all day breakfast or hamburger.  They have a bit of a cajun flair since they serve boudain sausage and Brabant potatoes. The vibe here is very mid century and relaxed.    Only about 1 mile from The Mermaid House on East Cesar Chavez.", "Cute New Orleans-inspired diner-like restaurant with delicious food and a very IG-friendly vibe - about a 25-minute walk from the house or quick Uber. They have a great all-day menu, brunch and late-night option. I would make reservations just to be safe! "]}, {"name": "Kitty Cohen's", "neighborhood": "East Austin", "google_place_id": "ChIJm27hEsm1RIYRExVBdwnexSY", "lat": 30.261783599853516, "lng": -97.71639251708984, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1390, "recommending_guidebooks": 137, "total_guidebooks": 2431, "blurbs": ["If you’re looking for a 1970s-inspired patio paradise, complete with portraits of Burt Reynolds, look no further than Kitty Cohen’s. Their outdoor area, complete with a decorative mini-pool in the center, serves as the perfect landscape to split a big bowl of their gin and Prosecco Key Party punch with friends -- which is, of course, served from a retro glass punch bowl into a matching set of handled cups. Their Froses and Aperol Spritzes are equally on-point for lounging underneath their green-", "Fun, ‘70s-inspired bar with lots of kitschy details When Kitty Cohen’s opened, people who lived in the same East Austin hood rejoiced: Finally! A cool, retro-inspired bar with real drinks and a beautiful patio. The concept borrows from the 1970s Palm Springs aesthetic: There is a wading pool, kitschy flamingo wallpaper, and a soundtrack dedicated to the era. Hit up Kitty Cohen’s with a couple of friends and order the shareable (and cheekily named) Key Party: Waterloo gin, cucumber, lemon, sugar,", "Kitty Cohen's: https://www.kittycohens.com Location: East Austin Distance: 3 mins by car  Kitty's is a great local neighborhood hipster bar. It has a Miami-vibe with the floral pastels inside and the small 2-ft pool on the patio (people roll up their pants and dip their feet in).  Often there's a pop-up food truck experience here and occasionally a fun promo event.  https://www.cntraveler.com/bars/austin/kitty-cohens"]}, {"name": "Sahara Lounge", "neighborhood": "East Austin", "google_place_id": "ChIJNbGBqxS2RIYRSfeubv_gKg0", "lat": 30.279451370239258, "lng": -97.68157196044922, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1150, "recommending_guidebooks": 122, "total_guidebooks": 2431, "blurbs": ["One of the few places still around to enjoy the soul of Austin. African night on Saturdays is the best! Enjoy a mature, relaxed and diverse crowd. There is a cover but includes the delicious African buffet. NOT for the snoody or uppity crowd. This is the down to earth, straightforward soul of Austin. Come with an open heart and mind to experience the magic of why I love Austin so much. ", "This bar/venue is a neighborhood institution. Another one of Austin's best kept secrets. They have great music from soul to African beats, to jazz. The dance floor is usually bumpin' and there is often free buffet on Saturdays. But a great food truck out back as well. The patio is HUGE and has a fire pit where I have often met interesting new people sharing laughs.  ", "This is one of those last gems of weird remaining in Austin. It's literally a walk down the street from my house (1 blk) so no need to worry about calling a cab for this one. There is usually a cover but most nights feature a local band and all sorts of locals from around the hood. Never a dull moment hanging around this funky haunt!"]}];

// ── CATEGORY CONFIG ──
const CATEGORIES = {
  all:             { label: 'All',            icon: '🗺️',  color: '#484848' },
  bar:             { label: 'Bars',           icon: '🍺',  color: '#9B59B6' },
  restaurant:      { label: 'Restaurants',    icon: '🍽️',  color: '#E67E22' },
  cafe:            { label: 'Cafés',          icon: '☕',  color: '#795548' },
  store:           { label: 'Shops',          icon: '🛍️',  color: '#2196F3' },
  park:            { label: 'Parks',          icon: '🌳',  color: '#27AE60' },
  museum:          { label: 'Museums',        icon: '🏛️',  color: '#8D6E63' },
  point_of_interest:{ label: 'Landmarks',     icon: '📍',  color: '#FF385C' },
  tourist_attraction:{ label: 'Attractions',  icon: '⭐',  color: '#F1C40F' },
  night_club:      { label: 'Nightlife',      icon: '🎶',  color: '#E91E63' },
  art_gallery:     { label: 'Art',            icon: '🎨',  color: '#9C27B0' },
};

// Get unique categories present in data
const presentCats = ['all', 'bar', 'restaurant', 'cafe', 'store', 'point_of_interest', 'park', 'museum'].filter(c => c === 'all' || POIS.some(p => p.category === c));

// ── MOBILE DETECTION ──
const isMobile = () => window.innerWidth <= 768 || ('ontouchstart' in window && window.innerWidth <= 1024);

// ── MAP INIT ──
const map = L.map('map', {
  center: [30.2672, -97.7431],
  zoom: 13,
  zoomControl: !isMobile(),
  tap: false,
});

// Remove zoom controls on mobile (use pinch-to-zoom instead)
if (isMobile()) map.zoomControl.remove();
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── STATE ──
let activeCategory = 'all';
let activeMarkerEl = null;
let currentQuoteIndex = 0;
let currentBlurbs = [];

// ── CATEGORY BAR ──
const bar = document.getElementById('category-bar');
presentCats.forEach(cat => {
  const cfg = CATEGORIES[cat];
  const count = cat === 'all' ? POIS.length : POIS.filter(p => p.category === cat).length;
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (cat === 'all' ? ' active' : '');
  btn.dataset.cat = cat;
  btn.innerHTML = `<span class="cat-icon">${cfg.icon}</span><span class="cat-label">${cfg.label}</span>`;
  btn.title = `${cfg.label} (${count})`;
  btn.addEventListener('click', () => selectCategory(cat));
  bar.appendChild(btn);
});

// ── MARKERS ──
const markers = {};

POIS.forEach(poi => {
  const cfg = CATEGORIES[poi.category] || CATEGORIES['point_of_interest'];
  const shortName = poi.name.length > 18 ? poi.name.slice(0, 16) + '…' : poi.name;
  const mentions = poi.rec_count.toLocaleString();

  const el = document.createElement('div');
  el.className = 'poi-marker';
  el.innerHTML = `
    <div class="marker-bubble">${cfg.icon}</div>
    <div class="marker-tail"></div>
    <div class="marker-label">${shortName}</div>
    <div class="marker-mentions">${mentions} mentions</div>
  `;

  const icon = L.divIcon({
    html: el.outerHTML,
    className: '',
    iconSize: [120, 64],
    iconAnchor: [60, 46],
  });

  const marker = L.marker([poi.lat, poi.lng], { icon }).addTo(map);
  marker.on('click', () => openCard(poi, marker));

  markers[poi.google_place_id || poi.name] = { marker, poi, el };
});

// ── CATEGORY FILTER ──
function selectCategory(cat) {
  activeCategory = cat;
  closeCard();

  // Update buttons
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });

  let count = 0;
  POIS.forEach(poi => {
    const key = poi.google_place_id || poi.name;
    const m = markers[key];
    if (!m) return;
    const visible = cat === 'all' || poi.category === cat;
    if (visible) {
      m.marker.addTo(map);
      count++;
    } else {
      m.marker.remove();
    }
  });

  document.getElementById('count-num').textContent = count;
}

// ── INFO CARD ──
function openCard(poi, marker) {
  // Deselect previous
  if (activeMarkerEl) activeMarkerEl.classList.remove('selected');
  // Can't easily get the div icon el from leaflet, so skip selection style for now

  currentBlurbs = poi.blurbs || [];
  currentQuoteIndex = 0;

  const cfg = CATEGORIES[poi.category] || CATEGORIES['point_of_interest'];
  document.getElementById('card-cat-pill').innerHTML = `${cfg.icon} ${cfg.label}`;
  document.getElementById('card-name').textContent = poi.name;
  document.getElementById('card-neighborhood').innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ${poi.neighborhood}`;
  const gmapsLink = document.getElementById('card-gmaps-link');
  gmapsLink.href = `https://www.google.com/maps/place/?q=place_id:${poi.google_place_id}`;
  gmapsLink.style.display = poi.google_place_id ? 'inline-block' : 'none';
  document.getElementById('card-rec-count').textContent = poi.rec_count.toLocaleString();
  document.getElementById('card-guidebooks').textContent = `${poi.recommending_guidebooks} of ${poi.total_guidebooks}`;

  renderQuotes();

  const card = document.getElementById('info-card');
  card.classList.add('visible');

  // On mobile, offset the pan so marker sits above the bottom sheet card
  if (isMobile()) {
    const mapHeight = map.getSize().y;
    const cardHeight = card.offsetHeight || mapHeight * 0.55;
    // Convert lat/lng to pixel point, shift up by half the card height, convert back
    const targetPoint = map.project([poi.lat, poi.lng], map.getZoom());
    const offsetPoint = targetPoint.subtract([0, -(cardHeight / 2 + 60)]);
    const targetLatLng = map.unproject(offsetPoint, map.getZoom());
    map.panTo(targetLatLng, { animate: true, duration: 0.4 });
  } else {
    map.panTo([poi.lat, poi.lng], { animate: true, duration: 0.4 });
  }
}

function renderQuotes() {
  const track = document.getElementById('quotes-track');
  const dots = document.getElementById('quote-dots');
  track.innerHTML = '';
  dots.innerHTML = '';

  const blurbs = currentBlurbs.length ? currentBlurbs : ['No host quotes available for this location.'];

  blurbs.forEach((b, i) => {
    const slide = document.createElement('div');
    slide.className = 'quote-slide';
    // Truncate long quotes
    const text = b.length > 280 ? b.slice(0, 277) + '…' : b;
    slide.textContent = text;
    track.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'quote-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToQuote(i));
    dots.appendChild(dot);
  });

  goToQuote(0);
}

function goToQuote(idx) {
  const blurbs = currentBlurbs.length ? currentBlurbs : [''];
  currentQuoteIndex = Math.max(0, Math.min(idx, blurbs.length - 1));
  const track = document.getElementById('quotes-track');
  track.style.transform = `translateX(-${currentQuoteIndex * 100}%)`;
  document.querySelectorAll('.quote-dot').forEach((d, i) => {
    d.classList.toggle('active', i === currentQuoteIndex);
  });
  document.getElementById('quote-prev').disabled = currentQuoteIndex === 0;
  document.getElementById('quote-next').disabled = currentQuoteIndex >= blurbs.length - 1;
}

function prevQuote() { goToQuote(currentQuoteIndex - 1); }
function nextQuote() { goToQuote(currentQuoteIndex + 1); }

document.getElementById('quote-prev').addEventListener('click', prevQuote);
document.getElementById('quote-next').addEventListener('click', nextQuote);

// Swipe support — registered once, works for all cards
(function() {
  const wrap = document.getElementById('quotes-track-wrap');
  let startX = 0;
  let isDragging = false;

  wrap.addEventListener('mousedown', e => {
    startX = e.clientX;
    isDragging = true;
  });
  window.addEventListener('mouseup', e => {
    if (!isDragging) return;
    isDragging = false;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 40) dx < 0 ? nextQuote() : prevQuote();
  });

  wrap.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
  }, { passive: true });
  wrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) dx < 0 ? nextQuote() : prevQuote();
  }, { passive: true });
})();

function closeCard() {
  document.getElementById('info-card').classList.remove('visible');
}
document.getElementById('card-close').addEventListener('click', closeCard);

// Close card when clicking map (but not when clicking the card itself)
map.on('click', () => closeCard());
document.getElementById('info-card').addEventListener('click', e => e.stopPropagation());
L.DomEvent.disableClickPropagation(document.getElementById('info-card'));
</script>
