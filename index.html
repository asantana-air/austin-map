 There are also multiple Capital Metro bus stops within the neighborhood, providing easy access to public transporta", "Mueller Park is a beautiful oasis in the bustling city of Austin, Texas. Spanning 140 acres, this park offers plenty of room to explore, relax, and enjoy the diversity of nature found here. Within its grounds are lush gardens and open green spaces that provide an escape from the hustle and bustle of city life. There's something for everyone at Mueller Park! Visitors can participate in activities like biking, fishing, jogging, or just taking a leisurely stroll along its many trails and paths. For", "Mueller is about a mile from our house and is an absolutely lovely neighborhood near a gorgeous man-made lake and park next to great restaurants and businesses. It's like a well-thought-out mixed-used area. We go there frequently to walk our dogs. Also of note in this area is the Alamo Drafthouse Theater, Lick Ice Cream, Sunday Farmer's Market, Kerbey Lane, Caroline's, and L'Oca Doro. If you have kids, the Thinkery museum is also here. Plus there's a small food truck park on the other side of th"]}, {"name": "C Boys Heart & Soul", "neighborhood": "South River City", "google_place_id": "ChIJyZBe1vq0RIYRBwmkhz2GlBw", "lat": 30.243656, "lng": -97.7522, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2272, "recommending_guidebooks": 159, "total_guidebooks": 962, "blurbs": ["A no-frills, old-school Austin music spot on South Congress with live bands almost every night. It’s intimate, a little gritty (in a good way), and one of the best places to actually dance without a huge crowd or long lines.  Vibe: Retro, local, slightly divey but cool Best for: Live music + dancing, low-key fun nights Good to know:  Live music daily (soul, blues, rock, funk) Small space = gets packed later at night Usually no cover or very low cover Upstairs lounge is more chill if you want a b", "A classic South Congress music bar with live bands almost every night—one of the best places in Austin to actually dance without dealing with huge crowds or long lines.  Vibe: Retro, local, slightly divey but cool Best for: Live music, dancing, casual nights out Good to know: \t•\tLive music nightly (soul, blues, rock, funk) \t•\tSmall space → gets packed later at night \t•\tUsually no cover or low cover \t•\tUpstairs lounge is more relaxed if you want a break  Why guests love it: It feels like “real Au", "Enjoy great live music onstage 7 nights a week, a spacious outdoor patio with vintage shuffleboard and one of the best kept secrets upstairs you will find the intimate, throwback cocktail lounge “The Jade Room” decorated beautifully by set designer Jennifer Long and her team. C-Boy’s Heart & Soul offers everything you want on a night out including easy parking.  C’mon down and get some Heart & Soul!"]}, {"name": "Quack's 43rd Street Bakery", "neighborhood": "Central Austin", "google_place_id": "ChIJbRDJuXbKRIYRi7T4PnhYBT4", "lat": 30.304645538330078, "lng": -97.7265853881836, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1225, "recommending_guidebooks": 162, "total_guidebooks": 2034, "blurbs": ["A long walk or a short bus ride/drive, Quack's has great and fresh baked goods daily. The food is so fresh that I once got into an argument with someone behind the counter who wouldn't sell me something that was seconds beyond the 3 hour mark or some such craziness. I wanted it so badly! I was willing to risk food borne illness, but no, they weren't having it. It's also near a fun park with lots of shade for the kiddos.", "A traditional Austin institution known for well made, cute, but not over-the-top confectionery. If you are expecting fancy patisserie dainty creations, you may be disappointed. But if you like cute cookies with whimsical decoration, and all the traditional favorite cakes, you will love this place. ", "The best baked goods in Austin, individual pieces of pie and cake, as well as eclairs, uniquely designed sugar and gingerbread cookies, breakfast pastries, coffee, and tea. Walking distance from guesthouse. "]}, {"name": "Juan in a Million", "neighborhood": "East Austin", "google_place_id": "ChIJu94Vu8q1RIYRI36mVrMr-IY", "lat": 30.255353927612305, "lng": -97.71906280517578, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1944, "recommending_guidebooks": 185, "total_guidebooks": 2431, "blurbs": ["Juan in a Million is a popular Tex-Mex restaurant located in East Austin. It's known for its breakfast tacos, especially the \"Don Juan\" taco, which features a large flour tortilla filled with potatoes, eggs, bacon, and cheese. The restaurant has a casual, laid-back atmosphere and is popular with locals and tourists alike.", "opened in 1980 and still one of the most popular spots in all of austin.  opened by juan and myrna meza, the restaurant values their homemade recipes and welcoming everyone like family. Juan still shakes hands with everyone who walks through the doors. - busiest on saturday and sunday brunch time/ early afternoon", "Popular spot, very East Austin. See if you can get a famous handshake from Juan himself.  If he is there, prepare yourself, and your shaking hand too. https://www.austinchronicle.com/best-of-austin/year:2001/poll:critics/category:food/juan-mesa-of-juan-in-a-million-best-restaurateur-handshake/"]}, {"name": "Alamo Drafthouse", "neighborhood": "East Austin", "google_place_id": "ChIJ595f4vi1RIYRiOMsgjtJDlk", "lat": 30.29844, "lng": -97.70482, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 3660, "recommending_guidebooks": 170, "total_guidebooks": 2431, "blurbs": ["The Alamo Drafthouse theater is my favorite thing about Austin, hands down.  There are 6 locations now, and it's worth going downtown to the Ritz for, say, a Master Pancake show, or down to South Lamar - officially named the Bong Joon Ho Cinema to honor the South Korean filmmaker - but it's not about the Alamo location, it's about the experience. Mueller is a nice location and a five minute car ride from the house. A great place to grab a burger while you watch a good movie. Just don't arrive la", "I know going to see a movie may be on the bottom of your vacation to-do list but Alamo theaters are not your typical theater! Located all over Austin they are a unique movie-going experience--one of the first theaters to offer food and drink service while you watch the movie! They also offer fun throw-back movies and movie viewing experiences. Just a great theater with a great personality. Plus there's one about a mile and half away from the guest house in a super cute area!", "This booming dinner-movie theater company has it's origins here in Austin. A unique preshow experience is shown in the half hour before showtime, with a curated selection of unique film footage themed to the upcoming movie (and not just the current blockbusters!). Many special events and screenings, with an order-from your-seats menu, the Alamo Drafthouse brand is rapidly expending into other states, but has it's origins here in Austin. (0.5 walk or short drive to Mueller)"]}, {"name": "Tacodeli", "neighborhood": "Central Austin", "google_place_id": "ChIJXQ-Uy2LKRIYR3SVdFPGjS-0", "lat": 30.310527801513672, "lng": -97.74011993408203, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 3038, "recommending_guidebooks": 168, "total_guidebooks": 2034, "blurbs": ["Our favorite breakfast tacos in town (though they have great tacos for lunch too!) You must order the Otto and a potato, egg and cheese. I also love the Mexico City chicken! Their guac is also a must-order. They have several other locations in town (this particular one is okay vibe-wise though it is walkable so yay) but we love the vibe of the location on Spyglass, which is a short drive away.  ", "Great breakfast tacos! We're partial to the \"Jess Special\" - a migas taco, and \"the otto\".  They're also known for their spicy \"doña\" green salsa which goes great on all breakfast options. They're only open until 3pm, so we recommend them for breakfast or lunch. The tacos here are slightly larger than traditional \"street\" tacos, but still small enough that we normally recommend 2 per person.", "You haven't visited Austin unless you've had a breakfast taco.  The town is basically split between Torchy's Tacos and Taco Deli.  We prefer Taco Deli.  Might we suggest the Jess Special or the Conquistador with queso fresco added.  On weekends be sure to call ahead and do a take out order to skip the crazy lines.  They close by 3 and breakfast tacos go away at 11 during the week."]}, {"name": "Gourmands", "neighborhood": "East Austin", "google_place_id": "ChIJha7nJMm1RIYRy3tadb3tYYI", "lat": 30.262649536132812, "lng": -97.71539306640625, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1440, "recommending_guidebooks": 156, "total_guidebooks": 2431, "blurbs": ["<10 min walk from my home and some of the best sandwiches in town. Gourmands is a neighborhood pub with a LOT of quirkiness. I used to play in a skeeball league here pre-COVID, and they've since replaced the skeeball machines with a ping pong table. They also do great things for the neighborhood and gave away a ton of free food during COVID to those who had been laid off or were homeless.  No reservations needed.", "Don't let this hole-in-the-wall restaurant and bar fool you! Their sandwiches and hoagies are some of the best in town! .We recommend ordering the bacchaus or the 7 deadly sin. You can't go to Gourmand's without also getting their broccoli cheddar soup bread bowl! The bread is unbelievably soft and doughy. YUM. Their bloody marys are tasty and almost a meal in and of themselves. ", "Classic neighborhood bar with great sandwiches. This is where you find a mix of people that have been in the neighborhood for 20+ years mixing with new locals. It's the cheers of the east side. Inside tip: Ask for the Godfather sandwich hot."]}, {"name": "Paperboy", "neighborhood": "East Austin", "google_place_id": "ChIJ4Y1SrLu1RIYRDZHWbSNOvIk", "lat": 30.27273941040039, "lng": -97.72823333740234, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1230, "recommending_guidebooks": 172, "total_guidebooks": 2431, "blurbs": ["Paperboy is so perfectly Austin in so many different ways and serves some of the best breakfast and brunch in Austin if you’re looking to enjoy things food truck style. Situated on 11th street, they serve simple breakfast items like cinnamon toast or homemade biscuits, and then there’s the Texas Hash and the B.E.C (bacon, sunny egg, pimento cheese, buttermilk bun). We have eaten here in the dead heat of summer and during windy “winter” months and the food is always consistently hot and delicious", "This is OUR FAVORITE breakfast spot. Their sweet potato hash is out-of-this-world good. This used to be a food truck and they just opened their brick and mortar (same location as their old food truck) in summer of 2020. This, along with Joe’s bakery, our are classic great breakfast/brunch recommendations!   Address/Phone: 1203 E 11th St., Austin, TX 78702/(512) 910-3010 Website: www.paperboyaustin.com Price Range: $8.00-$12.00 Walking Distance: 8-minute walk  ", "Paperboy is a breakfast and lunch spot, known for its thoughtfully curated menu and comfortable atmosphere. At our two Austin locations, we use simple, quality ingredients in our dishes, with bread, juices, sauces and preserves made in-house. Whether you grab a pastry and coffee to go or sit and enjoy a meal with your friends, we put just as much thought and care into the Paperboy experience as the food itself. "]}, {"name": "Ah Sing Den", "neighborhood": "East Austin", "google_place_id": "ChIJzUIE-a-1RIYRL2bDZ0UeZNk", "lat": 30.264860153198242, "lng": -97.73133850097656, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 2223, "recommending_guidebooks": 177, "total_guidebooks": 2431, "blurbs": ["This place is named for a famous former London opium den that was visited by the likes of Aldous Huxley. Decor is on point (pseudo-East/Southeast Asian style, with peacocks, bold accents, jewel/gold colors, and lots of velvet). Pros: friendly bar staff, high quality cocktails, creative menu, lively crowd, best regular house music offering in the entire city every Thursday night -- called \"Secret Garden\" -- for real, if you like house music and you need something to do on Thursday night, check th", "Technically, it's a restaurant.  But it has a fantastic speak-easy vibe going and some of the best cocktails in town.  Open the door, brush the heavy velvet curtain aside and behold the amazing prohibition-era type bar. A bit fancy, but worth it.  Great place for couples and groups of friends.  If there isn't a cool combo playing, just chill and watch the Buster Keaton silent movies they have running on a screen in the main seating area and enjoy the skilled bartenders doing their chemistry expe", "This revived historic East Austin landmark showcases “simple” but “unique” American large and small plates and “inventive” cocktails, all made with “locally sourced” ingredients; reports on the service vary, but most are charmed by the setting, comprising white honeycomb floors, glass chandeliers, copper-topped tables and reclaimed cabinetry and artifacts from an old Central Texas pharmacy. "]}, {"name": "Alamo Drafthouse South Lamar", "neighborhood": "Zilker", "google_place_id": "ChIJ0-fbEx-1RIYRDC-yUevuPhs", "lat": 30.255653, "lng": -97.761728, "category": "point_of_interest", "category_guidebook": "Local Signature", "rec_count": 140, "recommending_guidebooks": 145, "total_guidebooks": 394, "blurbs": ["Experience a legendary Austin night at Alamo Drafthouse South Lamar. This iconic theater redefines movie-going—with strict “no talking/texting” policies, in-theater food and full bar service, and a carefully curated lineup of new blockbusters, cult classics, and special events. Grab custom cocktails and gourmet snacks, settle into plush seats, and enjoy the perfect blend of film and hospitality—just a short ride  from the cottage.", "You can watch a movie and get amazing food and cocktails and dessert and snacks at this really cool movie theater venue.  ￼ The Alamo Drafthouse South, North and ￼Central are all amazing!  ￼The Amy’s Mexican vanilla ice cream shakes are out of this world!  ￼ The hamburgers and Portabella mushroom burgers are ￼ super delicious and amazing and the big scoop serving of fried will fill you up also!!!", "Austin originated this revolutionary restaurant/theater chain. The South Lamar location is the flagship and often shows really unique movies, especially with a genre or horror flavor. The long standing screening series: terror Tuesday and Weird Wednesday are considered classic Austin experiences."]}, {"name": "Patrizi's", "neighborhood": "East Austin", "google_place_id": "ChIJ_SqzjOy1RIYR0-au-H5SDZE", "lat": 30.28388023376465, "lng": -97.71727752685547, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1848, "recommending_guidebooks": 172, "total_guidebooks": 2431, "blurbs": ["Patrizi's is set up as a permanent food truck on the property of the Butterfly Bar, but don't think of this as \"food truck\" fare . . . they serve truly outstanding homemade pasta dishes.  The menu is small and limited, that's how they pull off the food truck thing, but man, it's delicious.  They have lots of seating, much of it under cover, on the Butterfly's property, and If the weather is pretty, this is a really great casual delicious meal and hang out.    The whole scene exudes what has made", "Best Handmade Pasta in Austin! Served out of a food-truck and surrounded by eclectic Austin vibe, this city favorite is the perfect spot to hang for an evening!  I recommend ordering a 1/2 pasta 1/2 Patrizi's salad option for an individual since everything is family style!  The Cacio Pepe is outstanding!  Another pro-tip is ordering a bottle of house red from the adjoined Butterfly Bar! You won't be disappointed! :)     ", "Feeling pasta but don't want to dress up? This is THE perfect place for a very chill night out. Patritzi's is located inside a theater venue called THE VORTEX. Park and go in and you will find the long line of people ordering from the coolest pasta truck you've ever seen. There are shows from the next door neighbor and a cool bar inside the venue where you get drinks and my personal favorite-truffled popcorn. "]}, {"name": "Bufalina", "neighborhood": "East Austin", "google_place_id": "ChIJ4ys7OrK1RIYRUYamRxM0adg", "lat": 30.255143, "lng": -97.719665, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1792, "recommending_guidebooks": 166, "total_guidebooks": 2431, "blurbs": ["Real Neapolitan pies and a well-curated wine list in an intimate space Bufalina’s authentic Neapolitan pizzas are the real deal, following strict guidelines set by the Associazione Verace Pizza Napoletana (try saying that three times). After adding toppings, the pies are baked in a 900-degree Stefano Ferrara wood-burning oven for about 90 seconds; pizzas emerge properly charred and slightly wet in the middle, a Neapolitan hallmark. While all are good choices, we’re slightly obsessed with two of ", "Fancy pizza no reservations Right by the house. Half price 4-530 but great anytime. Hip scene people come from all over town. Sit down place they only have wine salad and pizza. They only take reservations (and only by email only) for parties of 8 or more. Otherwise its walk in expect to wait an hour and they will text when your table is ready. There are cool places like you cd have a beer across the street at blue owl or go step into prizer gallery etc while you wait....Bufalina is Half price b", "Bufalina (12-Minute Walk)  Austin is in no short supply of good pies, so if you're craving some of the best this city has to offer, Bufalina is just a 12-minute walk away. This beloved Neapolitan-style pizzeria serves up wood-fired pies with fresh, high-quality ingredients. Known for its perfect crust and creative topping combinations, Bufalina is a must-visit for pizza lovers. Pair your pizza with a glass of wine from their excellent selection for a cozy and delicious meal."]}, {"name": "Uchi", "neighborhood": "Zilker", "google_place_id": "ChIJz2Whyx61RIYR7mCeZje-QWw", "lat": 30.25752067565918, "lng": -97.75977325439453, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 4832, "recommending_guidebooks": 147, "total_guidebooks": 394, "blurbs": ["Translated from the Japanese word “house,” the award-winning Uchi is located in a refurbished South Austin bungalow. Award-winning chef Tyson Cole’s signature, non-traditional take on Japanese food has delighted Austin’s diverse dining crowd as well as visitors from all over since 2003. Uchi is also THE restaurant that put Austin on the culinary map and produced a pool of extremely talented alumni who have gone on to also contribute to Austin’s food culture. Here’s what to expect at Uchi (and si", "Uchi is quite expensive, but also a special dining experience.  I highly recommend making a happy hour dinner reservation where they intentionally set a lower-priced more accessible menu for people who want to experience Uchi but can't afford the full menu.  It's sushi, it's really outstanding sushi.  But more, they really want people to explore, and understand sushi and Japanese food culture.  They do a lot of a explaining different dishes and offerings, making expert recommendations.  I've use", "The key to enjoying the exquisite sushi and dishes at finer dining Japanese restaurant Uchi is partaking in its stellar happy hour, aka the sake social. That’s when the notable restaurant serves up discounted nigiri, hand rolls, and other fun bites (think grilled escolar and sticky rice cakes). Again, Uchi doesn’t take reservations for the sake social, and the restaurant tends to get filled up fast during happy hour (it’s clear why), so get there right at 5 p.m. and grab a table stat."]}, {"name": "Central Machine Works", "neighborhood": "East Austin", "google_place_id": "ChIJVVVlryu0RIYRUtTow1H3t8E", "lat": 30.25202178955078, "lng": -97.70157623291016, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1690, "recommending_guidebooks": 169, "total_guidebooks": 2431, "blurbs": ["For those in the mood for local brews, make your way over to Central Machine Works, where everything from a full-bodied American Lager to a refreshing Pilsner, is homemade and on tap. However, if you are less-hop inclined, there are also amazing cocktails, such as the Frozen Espresso Martini, to sip at while kicking back in an indoor-outdoor space so massive that it used to be a factory making airplane parts. This brewery is also known for hosting fun weekend events -- be sure to check their web", "EAST SIDE - Central Machine Works Brewery is located in the vibrant East Side community on E. Cesar Chavez. Before opening as a brewpub in 2019, it was formerly known as Capital Machine Works- a metal fabrication shop that produced a variety of custom parts starting with airplanes in WWII (1940-2016).   The repurposed airplane hanger was designed to embrace the building’s history while creating a welcoming space for our community. With an open concept Beer Hall and expansive Beer Garden, CMW off", "Central Machine Works: https://www.cmwbrewery.com Location: East Austin Distance: 4 mins by car  Central Machine Works is local craft brewery that happens to also have a full bar! The space is giant with both indoor and outdoor patio seating. At night, there's usually a band playing tunes.  You can make table reservations for large parties (suggest you do if its a big party). Another casual family friendly venue during day - Adults only at night. Pet friendly too.  They serve pizza and pretzels "]}, {"name": "Via 313 Pizza", "neighborhood": "East Austin", "google_place_id": "ChIJiSURHbC1RIYRspCkHMgOgB8", "lat": 30.26996612548828, "lng": -97.74852752685547, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 4732, "recommending_guidebooks": 182, "total_guidebooks": 2431, "blurbs": ["If you can only have one pizza in your life... this might be the one you should try. If that sounds like blowing smoke, it is AT LEAST the one pizza in AUSTIN you should try.  Detroit style pizza where the cheese is baked all the way to the end of the crust, its just divine. The cheese heavens blessed us with this gift and you can walk from the house and partake of this bovine mana of which you will never ever forget. Best of all you can grab a drink inside Violet Crown while you wait and they w", " Type of Food: Detroit style pizza  Yum, yum, and yum! You can order this in, but it is SO much better eaten at the restaurant. They have a gluten free option, too! This is classic Detroit style pizza which has a thick crust, more cheese, and tomato sauce on top! We highly recommend this if you are in the mood for pizza.    Address/Phone: 1802 E 6th St, Austin, TX 78702-- (512) 580-0999 Website: via313.com, order online: grubhub.com Price Range: $10-$20/person Walking Distance: 15-minute walk", "If you’ve never had Detroit-style pizza, your visit to Austin is the time to do it. Yes, you read that right. Run by “two brothers from a hard-working, blue-collar area of Detroit,” Via 313 brings this unsung hero of regional pizza styles to a new level of yumminess. The nearby Oak Hill location gets quite busy (and doesn’t currently take reservations), so we recommend ordering takeout online."]}, {"name": "Suerte", "neighborhood": "East Austin", "google_place_id": "ChIJAQBE-7a1RIYRcZNYsxWYIUg", "lat": 30.262277603149414, "lng": -97.72327423095703, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1292, "recommending_guidebooks": 175, "total_guidebooks": 2431, "blurbs": ["One of the best restaurants in the city. Try the Don Dario Margarita as your first drink. There's also great wine and mezcal selection. The food is excellent. You can't go wrong with anything on the menu. Our favorites are the sopapillas, sword fish tacos and the suadero tacos. ", "We love Suerte when wanting a little more upscale, sexy and modern Mexican food experience. Their Suadero tacos and Don Julio are personal favorites. I recommend making a reservation ahead of time if you don't want to wait. ", "Mexican-inspired East Austin restaurant that combines local ingredients with house-made masa, mezcal and other specialty drinks for a fun unexpected dining experience. Offering snacks, beer, wine & craft cocktails."]}, {"name": "Uchiko", "neighborhood": "Central Austin", "google_place_id": "ChIJXQ-Uy2LKRIYR3W5SjLhBBj0", "lat": 30.31082534790039, "lng": -97.73995971679688, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 4256, "recommending_guidebooks": 177, "total_guidebooks": 2034, "blurbs": ["Ok, this is a big deal. Uchiko is really important. The food is outstanding- and the service makes you feel like princess Kate. I write them love letters. \"Social hour\" is 7 days a week from 5-6:30. Get there at 4:50 to ensure a table. Amazing deals at social hour, even teachers and yet-to-be-celebrated artists can afford it. 3 dollar unfiltered sake. 3-10 dollar options on the menu. Really, try everything. Reservations accepted for dinner (no reservations for social hour). A few days in advance", "Offshoot of the famed Uchi restaurant with upscale sushi & small plates in a farmhouse-chic space. Tyson Cole's menu consists of hot and cool tastings, sushi and sashimi, makimono, yakimono and tempura, and a changing omakase based on seasonal items. In 2011, Cole won the “Best Chef, Southwest” award from the James Beard Foundation.  We LOVE this place. We're pretty sure you will, too. ", "Can I say that this is one of my favorite Japanese restaurants in the world? And I've been to Japan and travelled a bunch. Their food is amazing.  Pro Tip: Their happy hour is one of the best that I have found. An amazing mix of food and drinks that gets you full and happy: everyday at 4 PM - 6:30 PM. Also, you can get their omakase if you are feeling like splurging - soooo tasty"]}, {"name": "Vespaio", "neighborhood": "South River City", "google_place_id": "ChIJMzsXmvy0RIYRfOa0WPLCeRc", "lat": 30.247332303172563, "lng": -97.7508150077911, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2008, "recommending_guidebooks": 137, "total_guidebooks": 962, "blurbs": ["Austin has many scene-y and envelope-pushing restaurants, where you can't get a reservation, there's typically a long line, and everyone is Instagramming their food. That's all well and good, but we find ourselves at Vespaio whenever we don't feel like fighting a crowd and feel like keeping a low profile. The service and the food are world-class, but the vibe is unfussy, and very old school Austin.  They make their daily risotto to order, from scratch; if you can get a table early enough, before", "Authentic  Italian.  The kitchen is driven wholly by handmade and locally-sourced ingredients, with the chefs doing all their own butchering, using every part of the animal. Fresh pasta, breads, stocks, charcuterie, desserts and cheese are all made in house. The wines are specifically chosen to complement the food, and are primarily Italian and French wines from boutique, family owned and small production producers.", "If you like fresh ingredients, clever cocktails, sumptuous wines, and Italian cuisine, we encourage you to try Enoteca. They have a sunny patio great for people watching. The menu changes daily, and we especially recommend their soups. The price is moderate, and if you really want to splurge, try their more elegant side, Vespaio, open only for dinner. "]}, {"name": "HOTEL VEGAS", "neighborhood": "East Austin", "google_place_id": "ChIJ85Q77rC1RIYRXC_PVHX_8Pc", "lat": 30.263412313027814, "lng": -97.72715811295943, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1936, "recommending_guidebooks": 166, "total_guidebooks": 2431, "blurbs": ["You wanna get Austin culture? Bring your torn jeans, spliffs, crazy lipstick, and moody stare. This is where bands are discovered and people too cool for you hang out. Next door is Volstead, which turns into a crazed dance house after midnight.  Iconic Austin. Also food trucks across the street.", "Hole in the wall? Check. Great live music scene? Check. People watching? Check. Food truck? Check. Patio seating? Check.  This is our favorite spot on pretty much any day or night. Tons of locals.  Tip: it’s also attached to Volstead which is known for some fun, sweaty dj/ dance floor action", "Hotel Vegas Bar is located in the heart of the east sixth street arts + entertainment district on the east end of the Salinas Building, next to neighboring sister bar The Volstead Lounge. Hotel Vegas offers live music and DJs just about every day of the week! Garage, psych, and punk music"]}, {"name": "Sour Duck Market", "neighborhood": "East Austin", "google_place_id": "ChIJAR7m4ZS1RIYRHB6RITAk13A", "lat": 30.280046463012695, "lng": -97.72151947021484, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1430, "recommending_guidebooks": 156, "total_guidebooks": 2431, "blurbs": ["Sour Duck Market’s mission is to extend the reach of our Craftsman’s cooking approach to the fast-casual market, while maintaining the integrity and support of our local farm and rancher supply chain. With our smoker as a center piece, expect smoked meats for sandwiches and plates. We offer a full bakery and coffee shop. Sour Duck will give our guests the experience of an enchanting outdoor beverage/dining lounge and to bring warm, authentic hospitality to a mixed retail restaurant setting. The ", "Great Happy Hour Sunday thru Thursday 2-6pm!  About: Austin’s mega-popular restaurants Odd Duck and Barley Swine’s new, much more casual sister restaurant offers smoked meats for sandwiches and plates, delicious appetizers,  a full bakery and coffee shop,  locally inspired brews, cocktails on tap, and wine.  Mission- Sour Duck Market’s mission is to extend the reach of our Craftsman’s cooking approach to the fast-casual market, while maintaining the integrity and support of our local farm and ra", "One of my favorite, casual restaurants in town. Loved by friends, families, and dog-owners, this mostly-outdoor seating restaurant has a rotating menu based on locally sourced food. Their co-owned by the group that does Odd Duck, their fancier counterpart, and the father owns Jack Allen's Kitchen, another local favorite with a location off of Anderson Lane in North Central Austin.  Reservation not typically needed."]}, {"name": "Sway", "neighborhood": "South River City", "google_place_id": "ChIJX5qi8OK0RIYR4SjE2J7x0_Y", "lat": 30.25012969970703, "lng": -97.75456237792969, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 2093, "recommending_guidebooks": 137, "total_guidebooks": 962, "blurbs": ["This isn’t your parent’s Thai restaurant where the menu consists of pad thai and fried rice with some weakly flavored glass noodles.  This is contemporary Thai where it’s assumed that you know a thing or two about Thai food.  With this expectation, guests do not decide the spice levels of their dishes.  You get it hot, or not at all. ", "Sway on 1st closed. Most of the dishes are very good but there is a stand-out - the Son-in-Law.  And ask about Jelly Beer which is a large Singha beer chilled down to slush.  Great for the heat of the food and the summer!!  Odd seating not good for large groups.", "Thai food. One of my favorite restaurants in Austin. Dim, intimate lighting. Try the Jungle Curry- it's spicy, but they provide coconut cream with the plate. The cream cancels out the spicyness. Tea selection is great too (they serve it in traditional teapots)."]}, {"name": "H-E-B plus!", "neighborhood": "East Riverside - Oltorf", "google_place_id": "ChIJ_0JDIUG0RIYRn64BKkCHNAc", "lat": 30.236522674560547, "lng": -97.72207641601562, "category": "store", "category_guidebook": "Local Signature", "rec_count": 1421, "recommending_guidebooks": 123, "total_guidebooks": 514, "blurbs": ["If you want a good selection of groceries, but cheaper than Whole Foods head over to H.E.B. There is a couple of reasons I love this grocery store. They started over 100 years ago in Kerville, TX so it's local. I love local if you can't tell. They donate and help out during so many things (i.e. hurricanes, floods, etc...). And I have had friends that work for them and they are excellent employers with great benefits. AND the reason it's called H.E.B. is it is the abbreviations of the owners name", "Groceries in the neighborhood. This is a 10-12 minute walk. Or a quick 2-3 minute drive. HEB does not have a lot by way of organics, or natural options. If that is important, you will want one of the other suggestions, or delivery.", "They have everything, huge grocery store. In a shopping center with other shopping spots nearby like Walmart, Target. 2 liquor stores. Several restaurants, and fast food places. Plus nail salons, if needed."]}, {"name": "Stay Gold", "neighborhood": "East Austin", "google_place_id": "ChIJSdzMWLS1RIYRffBvCqizv74", "lat": 30.256991245337492, "lng": -97.72374666654147, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1014, "recommending_guidebooks": 141, "total_guidebooks": 2431, "blurbs": ["This bar is within walking distance and has everything I loved about the east side of Austin all packed into one place.  A solid selection of canned and bottled local craft beer as well as a few on tap.  Reasonably priced mixed drinks that are crafted by experts of the trade and just a hint of the pride that comes along with being good at what you do.   Most nights of the week you can catch live music from a local band and most nights you are going to enjoy the show.  The patio is a great place ", "No cover charge, did I say free entry? If you are musically adventurous, any day of the week you'll find something different at Stay Gold. I've never seen music here that I didn't like from the Tap Dancer clicking his heels to the rhythm of a fiddle, or the 13 piece brass band,  the funky jazz quartet or the yacht rock band playing Steve Miller covers, all good and always free. It's right across Cesar Chavez, a 5 minute walk door to door.", "Nice little neighborhood bar. Live music pretty much every day. I've never seen the same band there twice, and all of the bands I've listened to there have been amazing. The place has a nice patio outside. Right next to it there's a food trailer park with lots of food options."]}, {"name": "South Congress Cafe", "neighborhood": "South River City", "google_place_id": "ChIJXTN1kvy0RIYRRwDr4vwY_CY", "lat": 30.247922897338867, "lng": -97.7506332397461, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1398, "recommending_guidebooks": 129, "total_guidebooks": 962, "blurbs": [" The South Congress Cafe has you covered, offering everything from venison meatloaf to duck sopes to crab cake Benedict. Show up whenever you want for its daily brunch and enjoy a drink while you wait. We recommend the Bloody Mary, which happens to be one of Austin's most beloved: tall glass filled to the rim with spicy mix, Tito’s vodka (infused with bell peppers, onions, celery, lemons, limes, garlic, and jalapeños), and served with celery, olives, and a pickled banana pepper.", "Independent bookstore selling used, collectible, vintage, and unique books South Congress Books is a bookworm's delight; the inventory includes a huge selection of vintage and collectible books on many subjects, as well as loose engravings for framing. Suddenly got an urge to pick up a first edition copy of The Right Stuff signed by Tom Wolfe himself? This is the place to do it. Looking to while away a few minutes before your Lyft arrives? Still the place to do it.", "Great little cafe that can get quite busy so go early for brunch or very late, Yummy carrot cake french toast and migas. Try to mimosas and order different fresh squeezed juices to make your own with a bottle of champagne. Fun and a great place to start for brunch before walking around SOCO shopping area."]}, {"name": "Radio Coffee & Beer", "neighborhood": "South Austin", "google_place_id": "ChIJR55fXzRLW4YRuB1uAbBXcpg", "lat": 30.231536865234375, "lng": -97.78777313232422, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 8169, "recommending_guidebooks": 121, "total_guidebooks": 305, "blurbs": ["One mile from the suite (a three minute drive north on Manchaca). Locally owned coffee and craft brew bar. Named Austin Chronicle \"Best New Bar 2014\" and Zagat's \"12 Hottest New Beer Bars in the US.\" This very hip place features Sumptown Fair Trade coffees, craft brews, a full bar, live music inside on weekends, and outdoor events and open mics during the week, high speed internet, two impressive dog-friendly outdoor patios and several great food trucks, including Veracruz All Natural, an award-", "Radio is both a coffee shop and a bar. Grab a stiff espresso there during the day while working away on your laptop, or a clod local beer at night while checking out open mic performers, or sitting outside with a group of friends. Service can be very average at times, but what it lacks in customer service it makes up by being one of the only cool joints around. They have a few food truck on site, including Veracruz which is one of the best vegetarian taco food truck in town.", "Radio Coffee is a hip spot with lots of outdoor seating and a couple food trucks on the lot. We like to go for coffee and breakfast tacos from Veracruz. If you like spicy food, be sure to get a side of the doña sauce. At night, Radio Coffee turns into a bar with good cocktails and live music. The Dee Dee Thai food truck is very popular in Austin and sells out fast. They only accept online orders and you can preorder before 3pm to avoid long wait times and sold out items. "]}, {"name": "Hoover's Cooking", "neighborhood": "East Austin", "google_place_id": "ChIJtbH2SZO1RIYRb9rykmS8BJw", "lat": 30.28437042236328, "lng": -97.72029876708984, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1208, "recommending_guidebooks": 140, "total_guidebooks": 2431, "blurbs": ["Southern Fare done right.  The majority of the menu is of the \"Meat-And-Three\" variety where you get a main meat entree with your choice of three sides.  The sides are great, top to bottom.  You could make a meal of just the sides, if you want.  Just don't pretend that any of the vegetable sides are remotely vegetarian.  I'm pretty partial to the chicken fried steak or chicken fried chicken (even better).  But they've also got some great barbecue mains, tasty burgers, and even some pretty great ", "Owner and chef Hoover Alexander has been bringing a good ol’ mix of Southern soul fare to Cherrywood for over 20 years with his homey restaurant. The menu highlights classic dishes done extremely well, from the chicken fried steak to the fried chicken to any of the sweet pies.", "Hoover Alexander has been bringing a good ol’ mix of Southern soul fare to Cherrywood for the past 20 years with the casual table-service Hoover’s Cooking. Favorites include the chicken fried steak (a Southern classic) and the fried chicken."]}, {"name": "Polvo's Mexican Restaurant", "neighborhood": "South River City", "google_place_id": "ChIJwYMyGuS0RIYR1wg5aP9sREY", "lat": 30.245298385620117, "lng": -97.75739288330078, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1974, "recommending_guidebooks": 128, "total_guidebooks": 962, "blurbs": ["Here's the thing about Polvos . . . they've got pretty solid Tex-Mex across the board.  But we're including them here because they happen to offer the finest fajitas you will ever experience.  The only reason to venture out of your way to Polvos is to order this:  - The Fajitas Al Guajillo with beef on flour tortillas.  I've eaten there with a party of twelve before, where the waitress went around the table, and each and every person, every single one, ordered that same dish, exactly that way.  ", "to drink: mexican martini, (top shelf if you're not driving) OR coconut frozen margarita (pitcher if you're not driving)  to eat: ask if Pavel is cooking, if so, tell him to make you the chaparrita special OR Cerveza fajitas, Polvos Fish, Fish Fajitas.....I could list the whole menu, but just order anything, you will like it  salsa bar + fresh homemade tortillas (flour and corn) all day  **ONLY SIT OUTSIDE, EVEN IF THERES A WAIT", "IMHO, THE best breakfast tacos in the city.  The size won't disappoint, the price is excellent and the fire-roasted salsa from the salsa bar (the dark one) is beyond amazing 👌.  Honestly I could put it on anything and it would be good!  It's a super casual place, good for families because it won't break the bank and the food is great.  If your up for a stroll its about a 15 min walk.  It can get busy so go early."]}, {"name": "Odd Duck", "neighborhood": "Zilker", "google_place_id": "ChIJi8__nx-1RIYR56djED9FLLE", "lat": 30.254670621315412, "lng": -97.76205349238668, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 2824, "recommending_guidebooks": 122, "total_guidebooks": 394, "blurbs": ["In 2014, chef Bryce Gilmore retired his trailer and opened a bright, modern bricks-and-mortar incarnation with similarly delicious, forward-thinking fare. Yes, the menu is still pork-, cheese-, and carb-heavy (and thank God for that), but real kitchen space allows Gilmore to also create more nuanced vegetable-forward dishes like beet tater tots with béarnaise and grilled mushrooms. Always packed with young diners looking to try the next dare food (#gatorpig), this is where the kids take their pa", "Helmed by a seven-time James Beard Award-nominated chef, Odd Duck is easily one of the best restaurants in Austin, period, and it's located directly across the street from my complex. Its menu is ever-evolving and heavily based on seasonal ingredients – almost all of which are sourced from specialty suppliers within the Central Texas vicinity – but some standouts include fried quail and redfish ceviche. Reservations recommended unless you arrive right around 5pm for its happy hour, in Sour Duck'", "Bryce Gilmore delivers exactly what one expects from the Austin chef with Odd Duck: one of the most pleasurable dining experiences in the city. The casual-leaning essential Lone Star restaurant exudes a Texas-forever vibe with New American dishes (pretzels with mushrooms and cheese) , magnificent large-format dishes (chicken fried fish heads) and on-point brunch (ham hash), which all work very well for groups — but get those reservations — in the homey setting.  1201 S Lamar Blvd. Austin, TX 787"]}, {"name": "School House Pub", "neighborhood": "East Austin", "google_place_id": "ChIJgUgxvOy1RIYR40R4tdhmJug", "lat": 30.284215927124023, "lng": -97.71881866455078, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1562, "recommending_guidebooks": 134, "total_guidebooks": 2431, "blurbs": ["When we're looking for some place to drink nearby that's not the Butterfly Bar, we do like School House Pub quite a bit.  They do have a great beer menu.  And they have some pretty decent happy hour food offerings.  They also have some indoor seating (which Butterfly really doesn't), so that's a plus . . . the inside and outside are on the smallish side, though.  Nice friendly casual vibe, all around.", "This is such a charming bar, themed like an old school, complete with chalkboards. They have one of the best burgers in town, hands down, delicious fries and beet salads. School House Pub also has a wide selection of beer, perfect spot for a yummy, casual dinner and drink!", "airy, woodsy neighborhood bar with scratch made-feel good pub food, craft cocktails , 20 craft beers on tap, and school themed drinks.  it feels like you are back in elementary school with old school desks for seating. "]}, {"name": "Jacoby's Restaurant & Mercantile", "neighborhood": "East Austin", "google_place_id": "ChIJqfpPuy20RIYR5ZmPEVDeVuo", "lat": 30.251501083374023, "lng": -97.70736694335938, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 1710, "recommending_guidebooks": 151, "total_guidebooks": 2431, "blurbs": ["Upscale restaurant in East Austin, Jacoby's Restaurant & Mercantile never disappoints with its flavorsome, All-American dishes. Chic and spacious with a hint of sophistication, the mood in this restaurant is set at a lively and friendly tone while the lawn offers a great outdoor dining experience with the lake at its backdrop. The menu boasts of an array of classic American delicacies from hearty burgers and sandwiches to succulent steak and smoked chicken. While the food menu might be filled wi", "EAST SIDE - Jacoby’s Restaurant & Mercantile is a Transparent, Value Driven, Vertically Integrated, Ranch-to-Table dining experience located in East Austin on the Colorado River.  They are family-operated with simple, southern, and rustic roots.  They have amazing southern-style food with the best strawberry cake we have ever had! It's a family recipe!  Their Mercantile is wonderful too, filled with vintage and modern one-of-a-kind pieces sourced from all over!  ", "You will get one of the best chicken fried steaks in town, along with a number of other Texas favorites.  Very classy, upscale place, which makes the humble Texas food shine the way it is supposed to shine.  The Jacoby family runs a ranch a few hours north west of Austin.  They have great food, great cocktails, a great wine list ... they know what they are doing.   Can get busy on the weekends.  Book a table for big groups."]}, {"name": "Texas Farmers' Market At Mueller", "neighborhood": "East Austin", "google_place_id": "ChIJUfiJvfm1RIYR18aDhOnca8s", "lat": 30.300261, "lng": -97.703459, "category": "point_of_interest", "category_guidebook": "Local Signature", "rec_count": 2431, "recommending_guidebooks": 138, "total_guidebooks": 2431, "blurbs": ["The Texas Farmer's Market at Mueller has been a vibrant and bustling Sunday attraction for the past 8 years. It offers local produce and artisan foods that are sourced directly from farmers and vendors, giving visitors a fresh taste of the Lone Star State. The Farmer's Market is open every Sunday, starting at 8 am and closing up shop at 2 pm. On any given day, visitors can expect to see a wide selection of local fruits and vegetables, as well as handmade cheeses, honey, jams, baked goods and mor", "Excellent local food... my tip: get the seafood, trucked in fresh from the coast... go early, to sells out quickly! Also the BEST kombucha anywhere... Buddha's Brew. Try a sample! And don't forget to pick up some amazing goat cheese from Dripping Springs, a nearby town. It's called Pure Luck, and it wins competitions for a reason...YUM!! Yes, there are bigger farmer's markets, but this one has everything, including live music, a free sampling table, and a petting zoo for the little ones! (don't ", "Located under the historic Browning Hangar in Mueller’s scenic Lake Park off Airport Boulevard, the Mueller Farmers’ Market operates from 10 a.m. to 2 p.m. each Sunday and 5 p.m. to 8 p.m. each Wednesday, often featuring unique, family-friendly live music activities among over 70 Texas vendors who sell seasonal produce, meats, cheeses, baked goods, specialty foods and select handmade products."]}, {"name": "Thinkery", "neighborhood": "East Austin", "google_place_id": "ChIJgarVmgi1RIYRpz5iYeJkXlA", "lat": 30.297319055173, "lng": -97.7051298593, "category": "museum", "category_guidebook": "Tried + True", "rec_count": 2824, "recommending_guidebooks": 166, "total_guidebooks": 2431, "blurbs": ["The Thinkery is a perfect blend of education and fun, providing interactive exhibits and activities that encourage creativity, critical thinking, and problem-solving skills. Kids will love exploring the various themed zones, where they can engage in scientific experiments, explore the wonders of nature, and unleash their creativity through art and design.  What sets the Thinkery apart is its commitment to making learning an exciting adventure. The museum's staff is friendly and knowledgeable, al", "Great place to take your kids!  Like no other kids \"museum\" or \"play place.\"  Read about it online, that's the best description. https://thinkeryaustin.org  From our house, it's a 20 minute drive IN TRAFFIC, but not much shorter without.  There are so many great parks and lakes near us, that only go to the Thinkery if you really want this as an option -- because otherwise there's just way too much great stuff within walking distance of our house for your kids!  Including playing with our really ", "Not really a museum, but part of the Austin Children's Museum network.  Despite what it says for the address above, this is in the Mueller neighborhood on Simond Avenue.  The ACM is on Colorado downtown.  The Thinkery is more like three floors of fantastic interactive exhibits for kids 3-11.  Giant playground outside, multiple rooms inside for making, building, drawing, painting, exploring almost anything your child can think of.  Really busy on the weekends, but it's a cornerstone of the Muelle"]}, {"name": "Zilker Metropolitan Park", "neighborhood": "Zilker", "google_place_id": "ChIJvUoqlg61RIYRhR5MzsWLcOs", "lat": 30.267850875854492, "lng": -97.77230834960938, "category": "park", "category_guidebook": "Local Signature", "rec_count": 16104, "recommending_guidebooks": 135, "total_guidebooks": 394, "blurbs": ["“3-acre pool, averaging 68 degrees year-round!”  Barton Springs Pool is a man-made recreational swimming pool located on the grounds of Zilker Park in Austin, Texas. The pool exists in the channel of Barton Creek and is filled by water from Main Barton Spring, the fourth largest spring in Texas. The pool is a popular venue for year-round swimming, as its temperature maintains a narrow range from about 68 °F (20 °C) in the winter to about 71.6 °F (22.0 °C) in the summer. The current admission fee", "Zilker Park is known as the crown jewel of the Austin parks system.  It is named for Andrew  Jackson Zilker.  Mr. Zilker came to Austin in 1876 to become a business man and a banker.  He operated one of Austin’s first  ice factories and was elected an Alderman.  He also ranched a 40 acre spread with good water southwest of town.   In three separate gifts in 1918, 1923, and 1931, Mr. Zilker gave his ranch, which included what is now known as Barton Springs,  to the city in a way that benefitted t", "Austin's most popular green space, the 351-acre Zilker Park is a favorite recreation area that sits alongside Lady Bird Lake and offers many things to do. The park's grassy expanses and picnic sites are ideal for lazy afternoons, but there are also many recreational facilities for the public to enjoy, including riverside walking trails, volleyball courts, a disc golf course, and the Zilker Playscape, a large playground with its own section designed for kids aged two to five years. Kids will also"]}, {"name": "Tamale House East", "neighborhood": "East Austin", "google_place_id": "ChIJU0iB3ba1RIYRkKACYijJG00", "lat": 30.261516571044922, "lng": -97.724365234375, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1216, "recommending_guidebooks": 132, "total_guidebooks": 2431, "blurbs": ["Tamale House East: https://www.tamalehouseeast.com Location: East Austin Distance: 6 mins by car  Tamale House East is an institution for Tex-Mex. The venue is small but really cute with an outdoor patio area. Great for tamales and tacos but has a full bar as well.  Perfect for next day hangover brunch  https://austin.eater.com/2019/6/21/18651218/tamale-house-east-family-valeras-vasquezez-tex-mex-restaurant-austin", "The owners are my friends. Amazing dancers, business people, and awesome food. Do not miss this place! Instagram beautiful!   Happily serving Austin since 1958. An Eastside original. All the food and drinks are made by hand. Featuring \"Mom's Migas\" and the Best Bloody Mary in town!  Best Tamales in town!  https://www.facebook.com/tamalehouse.east/", "The spirit of Austin institution Tamale House lives on with the colorful east side Texas 38 restaurant, which is run by the fourth generation of the Vasquez family. The migas are plentiful, tamales are abundant, the patio is lush, and yes, there are cocktails and beer.  1707 E 6th St. Austin, TX 78702 (512) 495-9504"]}, {"name": "Jeffrey's", "neighborhood": "Central Austin", "google_place_id": "ChIJn64e4Wu1RIYRGNdMhqJ5jNk", "lat": 30.28042221069336, "lng": -97.75911712646484, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1200, "recommending_guidebooks": 133, "total_guidebooks": 2034, "blurbs": ["Jeffrey's is one of Austin's best restaurants, and quite conveniently only a five-minute walk from my place! That said, it's also likely the most expensive restaurant in Austin, so you might wanna check out the menu on its website before making a booking (which I'd suggest doing well in advance). Pro tip: food-wise, they have one of the best happy hours in town - their entire bar menu is half price between 4:30-6:30pm Tuesdays thru Sundays and all night on Mondays. (Note that this applies only t", "Restaurateur Larry McGuire and chef/partner Tom Moorman brought new life into the refined dining room of classic restaurant Jeffrey’s in 2011. Diners can expect to either spend half a paycheck or opt for an affordable meal of pork chops and souffles at the elegant bar (Monday brings an all-night happy hour). The valets will park a '99 Corolla with as much panache as a Mercedes, so why not risk getting a little fancy?  1204 W Lynn St. Austin, TX 78703 (512) 477-5584", "Very high end restaurant with fantastic dining.  A long-time staple in Austin.  The cozy, plush bar with tufted velvet sofas, r gets crowded but worth the visit if you can find space.  Their happy hour menu serves steak and steak frittes at half price among other luxuries like pate and crudite.  "]}, {"name": "Pinthouse Pizza", "neighborhood": "Central Austin", "google_place_id": "ChIJV7paB2HKRIYR5I0plWFqp18", "lat": 30.318689346313477, "lng": -97.73899841308594, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2002, "recommending_guidebooks": 134, "total_guidebooks": 2034, "blurbs": ["Yes, this is a pizza place (the pizza is kinda meh) but the beer selection is fantastic! It can get packed during nights and weekends--there are another two locations in south Austin that are a bit roomier. If you're going to eat there, get the pizza rolls and the brownie...OMG the brownie!", "1.1 miles from your stay. A must-eat and must-drink on your list. Just a short mile from where you are staying. Pick one of their home-made fresh pizzas and you won't be disappointed. Don't forget to drink their famous and so delicious Hazy IPA - Electric Jelly Fish. Enjoy!", "A WALL FULL of local beer taps.  Pizza artfully crafted to compliment the beer (and not ONE that I haven't liked!). The Tap Jockies depth of knowledgeable is as impressive as the selection. Listed by Eater Austin as a top pick for craft beers."]}, {"name": "Clark's Oyster Bar", "neighborhood": "Central Austin", "google_place_id": "ChIJbeqvYxO1RIYR5zZEcyfr02s", "lat": 30.27299690246582, "lng": -97.7571792602539, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1656, "recommending_guidebooks": 143, "total_guidebooks": 2034, "blurbs": ["Truly our favorite spot for a special lunch or dinner. If you like oysters, you’ll love this place. Pro tip: Call them when they open on Saturday to get a reservation. Or if you're staying at the condo, just walk down the street and chat with the hostess/host for a reservation later that night or day. Sit inside to meet locals while you dine at the bar. Or enjoy the fresh air and people-watching on the small patio. You can't go wrong with the food but our must-orders are the scallops, kale, east", "Clark’s is a cozy neighborhood spot with a fantastic raw bar, fresh fish, one of Austin’s top burgers, and cocktails that run the gamut from tiki to modern classics. The white-washed walls, aqua and yellow color scheme, and fish tank all contribute to Clark’s chic, beachy vibe. Try their very popular pan-roasted black angus hamburger (sauce gribiche, Gruyere with Clark’s fries or slaw), or a dozen oysters on the half shell -- both are a great deal during Clark’s happy hour (Monday-Friday, 3pm-6p", "Clark's Oyster Bar: https://clarksaustin.com Location: West Austin Distance: 13 mins by car  Clark's Oyster Bar is a bougie, Hamptons-esque vibe. Fantastic food at a premium price point.  Happy Hour is M-F from 3pm - 5pm (so for those that don't work, on vacation, or can leave work early) and offers a great selection.  They offer half-off Burgers & Martinis (both amazing), 50¢ off Oysters and $5 Oyster Shooters. Be sure to check menu for other options"]}, {"name": "Licha's Cantina", "neighborhood": "East Austin", "google_place_id": "ChIJ6ymiaLC1RIYR4GW3rWuXlQw", "lat": 30.264089584350586, "lng": -97.72879028320312, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1521, "recommending_guidebooks": 135, "total_guidebooks": 2431, "blurbs": ["Bienvenido a Licha’s… Located in the heart of East 6th Street, Licha’s has become a niche restaurant for Austinites craving a bite of interior México. The restaurant is named after owner, Daniel Brooks’ mother, Alicia “Licha” Rivera, who is one of six children raised by Pepe and Licha Rivera in Mexico City. The atmosphere at Licha’s is casual and familiar. When you are here, you are in our home and we want to cater to you. You want a tequilita? You got it. Taquito al pastor? Coming right up. Ins", "This is our favorite Mexican restaurant in the neighborhood! The ambience is a wonderful old house and beautiful outdoor seating. They have many unique dishes such as duck, cactus salad, and all many class dishes. Taco’s al pastor is amazing and there ceviche is great. The wait is usually not too bad (you can always call ahead) and they have a steal of a deal happy hour.   Address/Phone: 1306 East 6th Street, 78702/ 512.480.5960 Website: www.lichascantina.com Price Range: $12.00-$25.00/Person Wa", "Located in a former 1920s bungalow. Inspired by Mexico City street food, the menu focuses on interior Mexican cuisine with dishes like huaraches, tacos al pastor, and quesadillas made with housemade blue-corn tortillas, VERY high-quality seafood dishes. The restaurant prides itself on its \"Mexican soul food\" and family-like atmosphere. The owner, Daniel Brooks, is known for his dedication to making everything in-house, from slow-braised meats to fresh-squeezed juices for cocktails. Great Happy H"]}, {"name": "El Chile Cafe y Cantina", "neighborhood": "East Austin", "google_place_id": "ChIJhW2TpRu1RIYRWVlj5CtOB94", "lat": 30.283483505249023, "lng": -97.7225341796875, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1125, "recommending_guidebooks": 127, "total_guidebooks": 2431, "blurbs": ["My personal favorite of a long long list of fantastic mexican spots around town.  This quasi tex mex spot always has fantastic drinks (try the prickly pear margarita) and delicious high quality food (shrimp enchiladas are a must try). They aren't usually that crowded either so its an excellent option for brunch when you have a large group and you realized you forgot to make reservations elsewhere.  Also incredible salsa.  Two kinds, one made from habanero.  So good they sell one of them at Whole", "El Chile is the best interior Mexican cuisine you'll find in Austin for a reasonable price.  It's kind of a poor-man's Fonda San Miguel.  They keep things pretty authentic, while throwing in a little bit of innovative flare.  Not the biggest and broadest menu, but the whole menu is good . . . as are their micheladas and mojitos!", "Spicy sweet success. That's El Chile. A testament to the power of friendship, loyal customers, and good fresh food. Or maybe it's the El ChileTini, the frosty Michelada or the spicy Chilango Margarita? Fans and critics rave about those too! Come see us and you'll see why. Bring your friends."]}, {"name": "Josephine House", "neighborhood": "Central Austin", "google_place_id": "ChIJm3RkX2m1RIYRa7ofUVcc4zQ", "lat": 30.280582427978516, "lng": -97.75904846191406, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1440, "recommending_guidebooks": 131, "total_guidebooks": 2034, "blurbs": ["Josephine House of Austin - The sister restaurant to Austin's fine-dining institution Jeffrey’s, offering breakfast, lunch, brunch, happy hour, dinner & Monday night steak frites. The Clarksville cottage features a small marble bar for coffee or cocktails, intimate tables in the dining room, shady nooks on our patio, and a grassy front lawn for lounging. Serving an eclectic daily menu featuring the best locally sourced products. Reservations are recommended.", "The sister restaurant to Austin fine dining institution Jeffrey’s, offering breakfast, lunch, brunch, happy hour, dinner & Monday night steak frites. The Clarksville cottage features a small marble bar for coffee or cocktails, intimate tables in the dining room, shady nooks on our patio and a grassy front lawn for lounging. Serving an eclectic daily menu featuring the best locally sourced products. Reservations are recommended.", "Great for brunch. Make sure to to call to see if they're open- the restaurant is often reserved for special events. Try the pancake and don't be intimidated by their price- they are very filling and can easily be shared between two people. After eating, walk down Waterston Avenue to  the Haskell House, its one of the few, albeit one of the most important, pieces of African American history in Austin. "]}, {"name": "Skylark Lounge", "neighborhood": "East Austin", "google_place_id": "ChIJMyWSF-S1RIYRIiC9y7_g4Uo", "lat": 30.285013, "lng": -97.704373, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 2327, "recommending_guidebooks": 135, "total_guidebooks": 2431, "blurbs": ["Part Austin dive bar, part live music venue; bringing you the finest in local & touring music talent in an atmosphere that is private, laid back and relaxed. Skylark Lounge has a full bar and serves cocktails nightly. Full bar and cocktails served nightly. Dark lounge with a cool vibe, super sound and music, truly a unique atmosphere. While centrally located, it’s tucked away, hidden and off of the beaten path (if we didn’t tell you where it was at you’d never find it).", "Part dark dive bar, part live music venue..the Skylark Lounge is housed in a building that is a throwback to times gone by. While centrally located, it’s tucked away, hidden and off of the beaten path (if we didn't tell you where it was at you'd never find it). Some real famous musicians have played there. When you pull up, don't be scared, go on in.", "In the evenings, if you're interested, the Skylark Lounge is a funky blues dive bar within walking distance (15 minutes maybe). It was recently named Yelp's #1 Music venue in the nation. Expect a $5-$10 cash cover, and expect a very diverse crowd with truly great blues music. The back patio is quiet if you want to just talk over a drink."]}, {"name": "Austin Bouldering Project", "neighborhood": "East Austin", "google_place_id": "ChIJUckS5Xi2RIYRvwB4-ZZ7Gto", "lat": 30.263174, "lng": -97.696248, "category": "point_of_interest", "category_guidebook": "Tried + True", "rec_count": 1504, "recommending_guidebooks": 132, "total_guidebooks": 2431, "blurbs": ["ABP (Austin Bouldering Project): https://austinboulderingproject.com Location: East Austin Distance: 2 mins by car (or a couple blocks walking)  Austin Bouldering Project is something else. At the time it was built, it boasted as the largest indoor bouldering gym but its more than that. They have a large weight room, 2 private rooms for yoga and a CrossFit room for classes thru out the day.  Upstairs is a sitting area with desks, benches, etc with Wifi so you can work as well. Of course there lo", "I can’t recommend a visit to ABP highly enough. If you are an experienced climber or complete noob, it’s a ton of fun. No gear, ropes or harnesses necessary, you can rent shoes for a few bucks and the first visit is free!   They also have great yoga and fitness classes, a first class gym for weight training and cardio and an upstairs balcony for co-working.   It’s very kid friendly, with separate areas for all ages and skills. My daughter and myself are both members and we go regularly.   When y", "My favorite bouldering location ever. This place is huge and has a great functional fitness gym, yoga studio, fitness classes, coworking space, and locker rooms with showers. If you like to climb or lift, this is a great place to check out!  If you're feeling thirsty afterwards, their Springdale location is right next door to Austin East Ciders and across the street from Sa-Ten, a hip little Japanese coffee shop."]}, {"name": "Torchy's Tacos", "neighborhood": "South River City", "google_place_id": "ChIJg239z-m0RIYRp2mpN1qppiU", "lat": 30.236753463745117, "lng": -97.76280212402344, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 16500, "recommending_guidebooks": 144, "total_guidebooks": 962, "blurbs": ["living the damn good taco dream. Who says you need a business plan to start a taco joint? After living it up at his fancy executive chef job, Mike Rypka decided to take his head full of ideas elsewhere and chase his dreams. He soon found them in Austin with a newly-acquired food trailer and a red Vespa scooter. A house was mortgaged. Credit cards were maxed out. Most importantly, some dreams came true. Torchy’s Tacos opened for the first time on South 1st at Bouldin Creek. Watching cars drive by", "TORCHYS. This place has gone to the moon and back with some off-the-grid taco combinations. The Brushfire is jerk chicken, mangoes, jalapenos, sour cream and cilantro. The Independent is deep-fried battered portobello mushroom strips, roasted corn, pickled carrots, refried black beans, and avocados with an insane chili aioli sauce that I would order shots of if they offered it. I like Torchy’s because there’s a ton of vegetarian tacos that are so flavorful, even meat-eaters would love. While you", " Torchy's Tacos started in 2006 with a mobile trailer, a little red Vespa, and a man with a passion for good food. The founder, Mike Rypka, left an executive chef position to chase his dreams by investing everything he had into Torchy's Tacos. With a new, experimental menu ready to serve but no mouths to feed, Rypka jumped on his Vespa and started throwing out samples in an attempt to draw customers to his trailer. Before he knew it, people were rallying beside the taco stand hollering, \"damn th"]}, {"name": "Wright Bros. Brew and Brew", "neighborhood": "East Austin", "google_place_id": "ChIJ_bOMha-1RIYRycZ5_NUCyho", "lat": 30.264394820111352, "lng": -97.73310079514606, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1590, "recommending_guidebooks": 128, "total_guidebooks": 2431, "blurbs": ["This is one of our absolute favorite places to sit and have a beer or coffee. They have a spectacular view of the city and it is great place to sit and read or use your computer (free wifi). They have good food options and a HUGE beer selection. They also have this amazing beer matrix that helps anyone familiar with or new to beer select the perfect drink!    Type of Food: Bar and Cafe Address/Phone: 500 San Marcos St‎, Austin, TX 78702/512.493.0963 Website: www.thebrewandbrew.com Price Range: $", "Good coffee and good beer are served under the same roof.  Brew & Brew, a coffee and beer bar, has definitely got the right idea. Don't want to travel that far for a cup of coffee? Just head to Jo's right down the street.", "Grady + Matt Wright have made this place a beer and coffee lover's dream! Their geeky beer matrix helps you select your perfect brew from the 38 they have on tap, and make sure to get a \"Brew & Brew\""]}, {"name": "Kemuri Tatsu-Ya", "neighborhood": "East Austin", "google_place_id": "ChIJl7OoOTO0RIYRskVofJdNTzE", "lat": 30.25383758544922, "lng": -97.71295166015625, "category": "bar", "category_guidebook": "Tried + True", "rec_count": 1380, "recommending_guidebooks": 133, "total_guidebooks": 2431, "blurbs": ["Texas meets Japan with the Lone Star-influenced izakaya from the Ramen Tatsu-ya team in Holly. The Texas 38 restaurant’s focus is on small plates. The lively restaurant is full of fun dishes, like a take on Frito pie made with octopus, and hot pockets with brisket. Then there is the expected like yakitori and smoked meats such as barbecue eel and fish collars, and, of course, ramen. The exotic and rarities menu features, well, just that, with items like marinated jellyfish and monkfish liver.  2", "Kemuri - Tatsuya: https://kemuri-tatsuya.com Location: East Austin Distance: 4 mins by car  Kemuri Tatsu-ya is an izakaya in east Austin, from the team behind Ramen Tatsu-ya. Offering smoked meats, yakitori, and izakaya classics with full bar.  Great place to start the night out or a party in itself (think of Asian restaurant bar where people eat/drink all night). Its got some great Japanese dishes and some with a Texas flare.  Part of the Tatsu-ya establishments you should check out", "I love love love the BBQ and Asian fusion at Kemuri Tatsu-ya. They are a bit pricier than they used to be, so look at the menu and see if you're willing to spring for the omakase menu. My favorite is when they have their BBQ ramen... YUM. It's a long walk from my home, so I'd definitely recommend a rideshare.  Reservation required."]}, {"name": "in.gredients", "neighborhood": "East Austin", "google_place_id": "ChIJS4CNJ-y1RIYRcn5PWdy2ScE", "lat": 30.285268783569336, "lng": -97.71461486816406, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1116, "recommending_guidebooks": 121, "total_guidebooks": 2431, "blurbs": ["This is a tiny neighborhood grocery store, super adorable.  They also have an outdoor patio space with picnic tables and kombucha and beer on tap.  In.gredients is a no waste grocery store.  So don't forget to bring your own bag if you're stopping by for a few items.   They also have live music on the weekends, the perfect place to  relax and have a beer in a low key neighborhood spot.", "This is a tiny neighborhood grocery store, super adorable. They also have an outdoor patio space with picnic tables and kombucha and beer on tap. In.gredients is a no waste grocery store. So don't forget to bring your own bag if you're stopping by for a few items. They also have live music on the weekends, the perfect place to relax and have a beer in a low key neighborhood spot.", "Small local bulk store with fresh local produce and many many other local items and things you may be looking for. They also have good coffee and decent beer selection and lots of snacks and treats to choose from. Seating outside to enjoy your food or drink a beer with friends. Child friendly. Check out website for events. "]}, {"name": "Flat Track Coffee", "neighborhood": "East Austin", "google_place_id": "ChIJkTM4la61RIYRm51Cg7lRuLg", "lat": 30.257715225219727, "lng": -97.72718048095703, "category": "point_of_interest", "category_guidebook": "Tried + True", "rec_count": 1017, "recommending_guidebooks": 128, "total_guidebooks": 2431, "blurbs": ["Flat Track Coffee shares it's building with otto. Menu: https://www.countercafe.com/menu Hours: 7:00 AM-3:00 PM Everyday", "If you are looking for a healthy and classic diner breakfast (buttermilk pancakes to crab cake Benedict to kale and eggs) this is your place! They cook everything to perfection and have great service. Longer walk, but worth it!   Type of Food: Classic healthy diner  Address/Phone: 1914 E 6th St, Austin, TX 78702/(512) 351-9961 Website: countercafe.com Price range: $7.00-$15.00 per a person  Walking distance: 16-minute walk, 3-minute drive "]}, {"name": "Little Deli & Pizzeria", "neighborhood": "Central Austin", "google_place_id": "ChIJC9KxeEzKRIYR4QxrF-IH3lk", "lat": 30.342674255371094, "lng": -97.72545623779297, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1116, "recommending_guidebooks": 116, "total_guidebooks": 2034, "blurbs": ["A small Northwestern-style deli with crazy good pizza, nestled in a tiny, 1940s shopping center.  Try the Mediterranean pizza, the vegetarian sandwich and their crisp Greek salad.  Pick up a cold beer at the quaint grocery store next door, and enjoy it with your meal at the shaded picnic tables.", "A small Northwestern-style deli with crazy good pizza, nestled in a tiny, 1940s shopping center. Try the Mediterranean pizza, the vegetarian sandwich and their crisp Greek salad. Pick up a cold beer at the quaint grocery store next door, and enjoy it with your meal at the shaded picnic tables.", "Tucked away in a nearby neighborhood is this deli with the best sandwiches - if you like a good Reuben or BLT, this is your place! It's a big family locals place next door is a great thrift shop, barber, jeweler and across from it there is a market and an ice cream shop."]}, {"name": "Hotel San Jose", "neighborhood": "South River City", "google_place_id": "ChIJ42oNp_20RIYRfFmBk743Hl8", "lat": 30.25037, "lng": -97.74943, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 960, "recommending_guidebooks": 110, "total_guid
