<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Austin — Host Recommendations Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rausch: #FF385C;
    --babu: #00A699;
    --arches: #FC642D;
    --hof: #484848;
    --foggy: #767676;
    --white: #FFFFFF;
    --light-bg: #F7F7F7;
    --border: #EBEBEB;
    --shadow: 0 2px 16px rgba(0,0,0,0.12);
    --shadow-hover: 0 4px 24px rgba(0,0,0,0.18);
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Cereal", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--white);
    color: var(--hof);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 64px;
    flex-shrink: 0;
    z-index: 1000;
    position: relative;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 700;
    color: var(--rausch);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .logo svg { width: 28px; height: 28px; }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--hof);
    border-left: 1px solid var(--border);
    padding-left: 20px;
    flex-shrink: 0;
  }
  .header-subtitle {
    font-size: 13px;
    color: var(--foggy);
  }
  .header-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--foggy);
    background: var(--light-bg);
    border-radius: 20px;
    padding: 4px 12px;
    flex-shrink: 0;
  }
  .header-count span { color: var(--hof); font-weight: 600; }

  /* ── CATEGORY BAR ── */
  .category-bar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 72px;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .category-bar::-webkit-scrollbar { display: none; }

  .cat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: var(--white);
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 72px;
    position: relative;
  }
  .cat-btn:hover {
    background: var(--light-bg);
    border-color: var(--border);
  }
  .cat-btn.active {
    border-color: var(--hof);
    background: var(--white);
  }
  .cat-btn.active::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 2px;
    background: var(--hof);
    border-radius: 1px;
  }
  .cat-icon { font-size: 22px; line-height: 1; }
  .cat-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--foggy);
    letter-spacing: 0.2px;
  }
  .cat-btn.active .cat-label { color: var(--hof); font-weight: 600; }

  /* ── MAP ── */
  #map {
    flex: 1;
    width: 100%;
    position: relative;
  }

  /* ── CUSTOM MARKERS ── */
  .poi-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    position: relative;
  }
  .marker-bubble {
    background: var(--white);
    border: 2px solid var(--hof);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
  }
  .poi-marker:hover .marker-bubble,
  .poi-marker.selected .marker-bubble {
    transform: scale(1.2);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    background: var(--rausch);
    border-color: var(--rausch);
  }
  .marker-tail {
    width: 2px;
    height: 6px;
    background: var(--hof);
    border-radius: 1px;
  }
  .poi-marker:hover .marker-tail,
  .poi-marker.selected .marker-tail { background: var(--rausch); }

  .marker-label {
    background: rgba(255,255,255,0.95);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--hof);
    max-width: 100px;
    text-align: center;
    line-height: 1.3;
    margin-top: 2px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .marker-mentions {
    font-size: 9px;
    font-weight: 500;
    color: var(--foggy);
    text-align: center;
    white-space: nowrap;
  }

  /* ── INFO CARD (overlay) ── */
  #info-card {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    max-width: calc(100vw - 48px);
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    z-index: 900;
    overflow: hidden;
    display: none;
    animation: slideUp 0.22s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(16px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  #info-card.visible { display: block; }

  .card-header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .card-category-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--light-bg);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--foggy);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .card-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--hof);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .card-neighborhood {
    font-size: 13px;
    color: var(--foggy);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-gmaps-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #FF385C !important;
    text-decoration: none;
    letter-spacing: 0.1px;
  }
  .card-gmaps-link:hover { text-decoration: underline; color: #FF385C !important; }
  .card-close {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--white);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--foggy);
    transition: background 0.15s;
  }
  .card-close:hover { background: var(--light-bg); color: var(--hof); }

  .card-stats {
    padding: 10px 20px;
    display: flex;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .card-stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .card-stat-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--hof);
  }
  .card-stat-label {
    font-size: 10px;
    color: var(--foggy);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .card-quotes-section {
    padding: 14px 20px 16px;
  }
  .quotes-heading {
    font-size: 11px;
    font-weight: 600;
    color: var(--foggy);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .quote-dots {
    display: flex;
    gap: 4px;
  }
  .quote-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }
  .quote-dot.active { background: var(--hof); }

  .quotes-track-wrap {
    overflow: hidden;
    border-radius: 10px;
    background: var(--light-bg);
    position: relative;
    touch-action: pan-y;
    user-select: none;
  }
  .quotes-track {
    display: flex;
    transition: transform 0.3s ease;
  }
  .quote-slide {
    min-width: 100%;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--hof);
    font-style: italic;
    position: relative;
  }
  .quote-slide::before {
    content: "\201C";
    font-size: 36px;
    color: var(--rausch);
    line-height: 0;
    vertical-align: -14px;
    margin-right: 2px;
    font-style: normal;
  }

  .quotes-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
  }
  .quote-nav-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--foggy);
    transition: all 0.15s;
  }
  .quote-nav-btn:hover:not(:disabled) {
    border-color: var(--hof);
    color: var(--hof);
    background: var(--light-bg);
  }
  .quote-nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* Leaflet overrides */
  .leaflet-popup { display: none !important; }
  .leaflet-div-icon { background: none !important; border: none !important; }

  /* Map attribution */
  .leaflet-control-attribution { font-size: 9px !important; }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    body { height: 100dvh; }

    header {
      padding: 0 16px;
      height: 52px;
      gap: 10px;
    }
    .logo { font-size: 18px; }
    .logo svg { width: 22px; height: 22px; }
    .header-title { font-size: 13px; padding-left: 12px; }
    .header-subtitle { display: none; }
    .header-count { font-size: 11px; padding: 3px 10px; }

    .category-bar {
      padding: 0 12px;
      height: 60px;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .cat-btn {
      padding: 6px 10px;
      min-width: 60px;
      border-radius: 10px;
    }
    .cat-icon { font-size: 20px; }
    .cat-label { font-size: 10px; }

    /* Card: full-width sheet pinned to bottom */
    #info-card {
      bottom: 0;
      left: 0;
      right: 0;
      transform: none;
      width: 100%;
      max-width: 100%;
      border-radius: 20px 20px 0 0;
      max-height: 55vh;
      overflow-y: auto;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Bigger tap targets for quote nav */
    .quote-nav-btn { width: 36px; height: 36px; font-size: 14px; }

    /* Larger close button */
    .card-close { width: 34px; height: 34px; }
  }
</style>
</head>

</div>

in the nation, and believe it or not, it actually lives up to the hype if you're willing and able to wait in the multi-hour line to get some.  It's only 1.5 miles from the house, so you can walk there if you choose, or it's a short drive.  People start lining up at 8:00 or 9:00 in the morning to be served when it opens at 11:00.  They sell out by about 1:00pm.  If you are on a pilgrimage for Texas barbecue, it really is worth the wait.  The li", "Aaron Franklin’s smokey meats have risen from humble trailer origins to become one of the country’s most talked-about barbecue destinations.   Everyone knows about the long lines at Franklin Barbecue — it’s been well documented — but for many, it’s worth the wait for those perfect briskets. Long lines form early for brisket, pulled pork & other smoked meats at this lunch-only spot. For those looking to plan ahead, it accepts preorders. And for a different take on Franklin brisket and other smoke", "Aaron Franklin’s interest in BBQ started with the backyard cookouts that he and wife, Stacy, would throw. When they opened up a small barbecue trailer on the side of an Austin, Texas, interstate in 2009, they had no idea what they’d gotten themselves into. Today, Franklin Barbecue has grown into the most popular, critically lauded and obsessed-over barbecue joint in the country (if not the world) — and Franklin is the winner of every major barbecue award there is, including Texas Monthly’s covet"]}, {"name": "Whisler's", "neighborhood": "East Austin", "google_place_id": "ChIJ1wVp97a1RIYR6eeMLojxHYo", "lat": 30.261932, "lng": -97.722741, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 7308, "recommending_guidebooks": 420, "total_guidebooks": 2431, "blurbs": ["Popular cocktail hangout with a large patio and legit mezcaleria Whisler’s is easily the most popular cocktail bar in East Austin because it manages to pull off a chill, social atmosphere while serving some of the best cocktails in town. Whisler’s menu -- thoughtfully developed by the uber-talented bar team over months -- embraces the season’s flavors in stunning new ways. The perfectly balanced, low-ABV Stuck in Spain (vermouth, lemon, orgeat) is a current standout, but Whisler’s most popular d", "Popular cocktail hangout with a large patio and legit mezcaleria. Whisler’s is easily the most popular cocktail bar in East Austin because it manages to pull off a chill, social atmosphere while serving some of the best cocktails in town. Whisler’s menu -embraces the season’s flavors in stunning new ways. The perfectly balanced, low-ABV Stuck in Spain (vermouth, lemon, orgeat) is a current standout, but Whisler’s most popular drink is a take on the classic Old Fashioned; a balanced blend of rye ", "Whislers is a popular cocktail bar located in East Austin. The bar is known for its creative and unique cocktails, a wide selection of craft beers, and a relaxed and welcoming atmosphere.  Whislers is housed in a renovated building and has a rustic decor with an industrial feel. The bar has both indoor and outdoor seating, including a spacious patio decorated with colorful murals.  The cocktail menu at Whislers is constantly changing, with a focus on using fresh and seasonal ingredients. The bar"]}, {"name": "Justine's", "neighborhood": "East Austin", "google_place_id": "ChIJrRT8_Cq0RIYRw5JlWkpX0aY", "lat": 30.25323486328125, "lng": -97.70057678222656, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 5592, "recommending_guidebooks": 392, "total_guidebooks": 2431, "blurbs": ["Justine's Brasserie: https://justines1937.com Location: East Austin Distance: 4 minutes by car  A local favorite hipster gem. French bistro located in heart of East Austin that magically transports you to Europe. While they do take walk ups, we highly suggest you make a reservation on Open Table several weeks in advance. Bar seats are first come, first serve and fantastic for solo or 2 people to enjoy drinks/dinner. They have a large outdoor sitting patio that offers fantastic people watching - ", "Awesome French restaurant for a fancier outing (fancy in Austin means wearing pants). Great for dates. Super hip, it feels like you are in a weird french film set in TX. Everyone there is probably cooler than you but no one cares. Great for late night dining too. Get the mussels, french onion soup and steak frite. Have a real tin-type photo taken in the trailer photo booth by a guy using a 19th century camera, developed on site on a metal plate - http://lumieretintype.com/.  Lots of outdoor seat", "I may be biased being natively French but in my opinion this is bar-none the best food Austin has to offer. From the quality and selection of French-inspired dishes to the cool outdoor ambiance of cloth tents with string lights and dimly lit romantic & sensual indoor setting, this place has it all. Go here for a very special celebration or simply to soothe your soul. You’ll probably need to make a reservation at least one week out, check their website www.justines1937.com 4710 E 5th St, Austin, "]}, {"name": "The Continental Club", "neighborhood": "South River City", "google_place_id": "ChIJJUbJuv20RIYRpFyFb-IiSZo", "lat": 30.25052983754337, "lng": -97.74916689922115, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 4037, "recommending_guidebooks": 330, "total_guidebooks": 962, "blurbs": [" Check Live Music Schedule  The granddaddy of live music venues, the Continental Club has enjoyed a coast-to-coast and worldwide reputation as the premiere club for live music in Austin since 1955 and in Houston since 2000. The historic Austin live music destination first opened its doors in 1955 as a swanky private supper club, but in the decades since, it's become a mecca for roots, rockabilly, country, swing, rock and blues music every night of the week. The classic neon sign flash “When thin", "South Congress is one of the most iconic locations in Austin! It's the birthplace of SXSW and captures the funky vibes that keep Austin weird. The Continental Club is one of the most esteemed music venues and features the most talented musicians across the nation. There is a smaller spot down the street from the main location on the corner called The Gallery at The Continental Club that you have to take a flight of stairs to. It has a more intimate energy to it and also has a ping pong table on ", "You really need to catch a show at The Continental Club. The granddaddy of all local music venues, Rockin South Austin Since 1955, the legendary Continental Club celebrates over 60 years as one the oldest continuously running clubs in all of Austin. It started out as a swanky supper club, then became Austin's first burlesque club and later became a working man's blue collar bar on South Congress that opened every morning at 7am and eventually grew into one of the premier live music venues.  Webs"]}, {"name": "Hillside Farmacy", "neighborhood": "East Austin", "google_place_id": "ChIJsd3VtLu1RIYRQFcnKzRUnJI", "lat": 30.26824378967285, "lng": -97.72691345214844, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 2853, "recommending_guidebooks": 308, "total_guidebooks": 2431, "blurbs": ["Type of Food: American Bistro This is another one of our favorites for a nicer meal. They have great cocktails and appetizers along with dinner/lunch/brunch options. The inside décor is spectacular. They also have Stumptown coffee and Cool Haus ice cream sandwiches (http://www.yelp.com/biz/coolhaus-austin-3), which is great for a quick pop in snack.  A few of our favorite things here are the charcuterie plate and homemade sodas.    Address/phone: 1209 E. 11th, Austin, TX 78702/ 512.628.0168 Webs", "Hillside Farmacy could easily get by on its good looks alone. There is a ridiculous amount of charm here, both inside and out on the striped-awning covered patio. The space plays up its origins as Hillside Drugstore, with vintage tile floors, cabinets leftover from the pharmacy, and a highly “cute” old-school feel throughout. We dare you not to post an Instagram before you even sit down.", "Enjoy the quirky yet tasteful ambiance of this old pharmacy turned restaurant! We recommend going from 3pm - 6pm to capitalize on their awesome happy hour deals. Order the peel-n-eat shrimp and mac n' cheese to start, along with their spicy grapefruit margarita. Their hillside burger is also quite delicious for those with a larger appetite!"]}, {"name": "Home Slice Pizza", "neighborhood": "South River City", "google_place_id": "ChIJu96UVvy0RIYRCPxWa4TSr6o", "lat": 30.249221801757812, "lng": -97.74951934814453, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 10425, "recommending_guidebooks": 288, "total_guidebooks": 962, "blurbs": ["Home Slice Pizza: https://homeslicepizza.com Location: South Congress area Distance: 15 mins by car  Home Slice Pizza is the best thin-crust NY style pizza in Austin.  There are 3 locations (2 right next to each other on S Congress). All locations are good but the S Congress is the original. The More Home Slice front is pizza by the slice or to go orders (they do have a small indoor/outdoor eating area)  The other locations are designed for sit-down menu and have many options outside of pizza (b", "Best Pizza in town, located on the South Congress strip a half-mile south of the river. Kiosk (no seating). Award-winning Pizza that does it right one slice at a time. Open Friday and Saturday 11-midnight, Sunday 11 to 11 pm. Open late for take-out on weekends as well.   If you only have a day and an evening in Austin, it's a good place to hit if you take in the Congress Avenue strip and then head to downtown or Rainey Street in the evening. See \"South Congress Avenue\" under Sightseeing for more", "Home Slice Pizza is a beloved Austin institution, offering some of the best New York-style pizza in the city. Located on South Congress Avenue, this cozy pizzeria serves up delicious, hand-tossed pies with a perfect crispy crust and an array of mouthwatering toppings. Whether you’re grabbing a quick slice or enjoying a full meal with friends, Home Slice’s laid-back atmosphere, combined with its consistently tasty pizza, makes it a local favorite for both residents and visitors alike."]}, {"name": "Launderette", "neighborhood": "East Austin", "google_place_id": "ChIJQwHkAku0RIYR-lvYDf4FijU", "lat": 30.2518901281547, "lng": -97.72278594970703, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 3510, "recommending_guidebooks": 307, "total_guidebooks": 2431, "blurbs": ["Gourmet New American fare from the superstar chefs Rene Ortiz and Laura Sawicki is Launderette, the stylish all-day neighborhood cafe in Holly. The Mediterranean-influenced menu means more upscale takes on on the usuals, like toasts topped with crab, grilled prawns, and burgers served on challah. Since pastry wizard Sawicki is involved, the birthday cake ice cream sandwich and other desserts are worth ordering.  2115 Holly St. Austin, TX 78702 (512) 382-1599", "Launderette is another “perfectly Austin” restaurant situated on the east side of town, and definitely serves some of the best breakfast and brunch in Austin. They have great classic breakfast options or a delicious fried chicken sandwich or burger if you’re looking to put more “lunch” in your brunch. Try the pork shoulder hash for our favorite savory brunch menu items and at the very least share some buttermilk pancakes with someone else at the table.", "Award winning popular restaurant right in front of my house (we share the alley). There are small plates, depending on your budget and where you live the prices might seem fine or expensive, but definitely the waiters will point you to the bang for your buck plates (larger portion). The craft cocktails run 10-12$ but are half-price at happy hour and are delicious. Beers and wine are standard restaurant price. "]}, {"name": "La Barbecue", "neighborhood": "East Austin", "google_place_id": "ChIJIR1tw661RIYRUgfHust5Vv0", "lat": 30.256107330322266, "lng": -97.72234344482422, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 4334, "recommending_guidebooks": 310, "total_guidebooks": 2431, "blurbs": ["The boys have got nothing on barbecue royalty LeAnn Mueller and wife Ali Clem; the granddaughter of legendary pitmaster Louis Mueller and the popular ‘cue truck have garnered more attention than ever this year, and for good reason: Their meat is incredible and rivals you-know-who. The operation has moved from the sweltering food truck park into the air conditioned Quickie Pickie (thank you, Jesus) on East Cesar Chavez, and the lines and buzz don’t seem to be stopping anytime soon. Try the fatty ", "Because this is Austin, barbecue is a must. Head back to the east side for smoked meats courtesy of LeAnn Mueller, who happens to be from the legendary Mueller barbecue family (her late father ran Louie Mueller Barbecue in Taylor, Texas, which is now run by her brother Wayne). Yes, get the brisket and beef ribs, especially if the latter’s available.   Even better: the former food truck’s newer digs within Quickie Pickie means there is air conditioning while you wait, plus access to coffee and be", "Yes, the meat is that good at Franklin Barbecue but do you really want to spend your time in Austin waiting in line? It’s your call, but we’d like to suggest the just as mouth-watering la Barbecue. Treat your taste buds with seriously tender brisket, but don’t miss the ribs. Oh, and the sides? At this east side trailer surrounded by a few simple picnic tables with some enormous old trees for shade, it’s the chipotle coleslaw—zestier than most with a kick to match the house-made chipotle sausage—"]}, {"name": "H-E-B", "neighborhood": "East Austin", "google_place_id": "ChIJDTijp--0RIYRuzha5kuElqw", "lat": 30.238630294799805, "lng": -97.75507354736328, "category": "store", "category_guidebook": "Local Signature", "rec_count": 7100, "recommending_guidebooks": 300, "total_guidebooks": 2431, "blurbs": ["You are super close ( I walk all the time ) to the #1 HEB ( grocery store chain that us Texans love) in the state! The store was even recognized by the American Institute of Architects (AIA)  as one of the top 10 most sustainable architecture projects of 2016.   They have an awesome little cafe with live music on Friday, Saturday, and Sundays. And Happy hour is 3-7pm during the week 5-close on Sundays. More info here:  https://www.heb.com/static-page/Cafe-Mueller-by-H-E-B ", "Even though this is the 2nd closest HEB to the house, this is the best HEB to get your groceries. This store has a cafe, live music and a huge selection of groceries.  Use the HEB app to order groceries and pick them up at curbside or have the groceries delivered to the house if you like. Go to this HEB, not the one closest to the house on Manor Road; avoid the Manor Road HEB.", "Excellent but not huge HEB grocery, a beloved Texas chain. Many prepared items, including 30 soups, housemade tortillas in the bakery section, and they sell Easy Tiger sourdough round bread which freezes perfectly! Excellent brisket barbecue available and a small food court with trendy providers and bar with live music. Drive-thru pharmacy and gas station as well."]}, {"name": "Salty Sow", "neighborhood": "East Austin", "google_place_id": "ChIJ61i-aZO1RIYRKgxgoJHJc28", "lat": 30.283655166625977, "lng": -97.72126770019531, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 4472, "recommending_guidebooks": 290, "total_guidebooks": 2431, "blurbs": ["Of all the places within a short walk from our house, Salty Sow is probably the nicest, but also the most expensive.  They call themselves mindfully-sourced contemporary farmhouse fare, and that seems about right.  We go there as a special treat with our out of town friends.    We highly recommend going at Happy Hour and just ordering a meal's worth of their incredible appetizers and small plate dishes, which are all half off then.  It's makes the whole thing pretty reasonable.  Tip: Order the C", "Salty Sow is an American Gastropub that serves contemporary farmhouse fare. Hand-crafted meats, cocktails and entrees are served fresh daily, mindfully sourced from local farms and purveyors. Modern and unpretentious, Salty Sow’s chef-driven menu delivers thoughtful, farm-to-table eats in a casual setting, making it a trusted neighborhood eatery.", "A little bit of a drive but well worth it, especially for their unbeatable (daily!) happy hour with specially priced cocktails and menu items. We HIGHLY recommend the fried chicken on their happy hour menu, which is only about $7 and will easily suffice for a meal. There are also many other bars and restaurants in this area on Manor road."]}, {"name": "Quickie Pickie", "neighborhood": "East Austin", "google_place_id": "ChIJRRF-HLW1RIYRGjYYgzQR-QY", "lat": 30.25612449645996, "lng": -97.72233581542969, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 2352, "recommending_guidebooks": 263, "total_guidebooks": 2431, "blurbs": ["Not to be confused with the Quickie Mart from the Simpsons, Quickie Pickie has a phenomenal selection of Beer and Wine, excellent food (get their breakfast tacos), coffee and great basics like ice cream, fruit, sandwiches and more. Tons of great local products, and a nice rotation of new goods. You'll never walk out regretting what you bought. Plus its easy walking distance from the house!", "Within walking distance. Decent selection for essentials, with a surcharge for convenience. Also serves beer and coffee, while housing one of the best BBQ joints in Austin. La Barbecue.  If you have the time or stop by without a line for the BBQ, get some of the sliced brisket. It's a close second for my favorite brisket in town, right after Franklins. ", "This is a bar/restaurant/upscale mini-market.  Huge beer selection on tap, great wines and delicious food.  Our favorites are the vegan breakfast tacos, the \"Radio\" tuna salad sandwich, and the hatch green chili burger, but they've got lots of good stuff.  It's open early and late, and is always a hipster scene.    "]}, {"name": "Cenote", "neighborhood": "East Austin", "google_place_id": "ChIJ25jniq61RIYRKMcppfZ-Rv0", "lat": 30.260507, "lng": -97.733723, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2070, "recommending_guidebooks": 271, "total_guidebooks": 2431, "blurbs": ["Located in a renovated historic home in the East Cesar Chavez neighborhood, Cenote specializes in high quality espresso and local fair trade coffees, but that isn't all this coffeehouse has to offer. The menu includes delicious pastries, breakfast and lunch sandwiches, salads and plenty of gluten-free options, all made with local organic ingredients. With great coffee, fresh food, and a comfortable atmosphere, Cenote is definitely worth checking out.", "East Austin coffee shop situated in an historic house with indoor and patio seating.  Full food menu of fresh offerings made with the best ingredients, including local veggies from many Texas farms, pasture raised eggs from Vital Farms, and bacon from Flying Pig Provisions. In addition, we have a great selection of beer and wine. Order at the counter,  bush your own tables.  Very casual, but a great spot to hang out.", "Homemade bread makes for some seriously dank sandwiches. I dunno how they do it...It's also probably the only place i'll pay $14 for a salad (haha wtf) but its damn good & made with local organic ingredients and hormone (etc) free chicken. They have a juice bar, great coffee and a abundance of pretty people sitting out on the adorable patio soaking in vitamin D. Take your mom here~ she'll love it."]}, {"name": "El Chilito", "neighborhood": "East Austin", "google_place_id": "ChIJBS6qley1RIYRLGalCMlDAE4", "lat": 30.284149169921875, "lng": -97.71837615966797, "category": "point_of_interest", "category_guidebook": "Local Signature", "rec_count": 3036, "recommending_guidebooks": 259, "total_guidebooks": 2431, "blurbs": ["Austin is rich in tacos and taco stands.  El Chilito holds its own against any of best taco joints in town.  Their offerings range from pretty simple and traditional tacos, to some nuevo hipster varieties.  They're all great.  And two will fill you up.  They have a breakfast taco section of the menu, and a lunch-and-dinner taco section.  You can order from either at any time of day.  It's a taco window with plenty of outdoor seating, but no \"dining room\" per se.  Tip: They have a drink called th", "El Chilito was born as a fast-casual approach to El Chile, a contemporary take on modern Tex-Mex dining located just a few blocks west on Manor Rd. Dubbed El Chile’s “little brother,” El Chilito, uses many of the same flavors, but in a more laid-back atmosphere and a lot of local charm.", "Delicious breakfast Burritos. They serve all of their items in a variety of Tacos, Burritos, or a plate. But stick with the burrito, just trust me there. For maximum happiness, get the Chicon. If you need a little boost in the morning, order an Ojo Rojo and you won't be disappointed. "]}, {"name": "Fresh Plus Grocery", "neighborhood": "Central Austin", "google_place_id": "ChIJ6VvSWWm1RIYRkg5f7o_N3gU", "lat": 30.280807495117188, "lng": -97.75828552246094, "category": "store", "category_guidebook": "Local Signature", "rec_count": 3528, "recommending_guidebooks": 252, "total_guidebooks": 2034, "blurbs": ["Fresh Plus is our neighborhood grocery store. They have about everything. It's where you go for about 10 items. For larger trips you would go to Central Market, HEB, Wheatsville.... Fresh Plus is special because it is so close and easy. Oh, you need garlic and beer? Just walk to Fresh Plus. Easy. But I like to imagine it is a live art installation. The employees, their perfect body language, the music, the start up vendor wanting you to try their salsa, the neighbors getting their odds and ends,", "Fresh Plus is a grocery store local to Austin that has everyday basics as well as unique items you might only find at a boutique grocery store. They sell pre-made items like sandwiches and wraps and even a falafel-humus platter! Their produce section is awesome, and they even have a great wine selection!", "Fresh Plus is a small but well-stocked grocery store located about five minutes away by foot. In addition to regular staples, it carries a sizable number of locally produced products, including everything from artisan ice cream to local microbrews."]}, {"name": "Whole Foods Market", "neighborhood": "Central Austin", "google_place_id": "ChIJf5QJFBK1RIYRjjfxZz9Z0O0", "lat": 30.270550694736155, "lng": -97.75317517828881, "category": "store", "category_guidebook": "Tried + True", "rec_count": 21258, "recommending_guidebooks": 357, "total_guidebooks": 2034, "blurbs": ["You've probably heard of Whole Foods, now that it's become an international chain, but did you know it was founded right here in Austin? Its flagship store on the western end of downtown is a must-see; it's the largest Whole Foods in the world, and also hosts over a dozen \"dining stations\" where you can order meals of all types and eat them right then and there. In addition to the usual staples found at all Whole Foods stores, the flagship has a walk-through \"beer fridge\" featuring hundreds of c", "In addition to having thousands of healthy eating options and fresh organic produce, this giant  Whole foods has an oyster bar with hundreds of beers (and homemade rootbeer) on tap, where they will cook to order any meat, seafood, or veggies you select from the store. I love their garlic parmesan oysters, and there are empty glass racks throughout the store so you can enjoy your beverage while you shop. Also, check out their selection of wines, cheeses, and their beautifully tempting bakery brea", "My favorite grocery store in town and probably the best Whole Foods I have been to so far! It's beautiful! The produce always seems to be great and I have found a lot of local produce, which I love. Also, the beer section where you can purchase refillable bottles and pick your beer is so fun and a great way to be adventurous and eco friendly at the same time. I have only encountered friendly employees and have gotten great quality food from them. Parking has always been easy for me with the unde"]}, {"name": "Bouldin Creek Cafe", "neighborhood": "South River City", "google_place_id": "ChIJH-Sj5OK0RIYRjC-_RrNEotk", "lat": 30.246492385864258, "lng": -97.75679016113281, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 6253, "recommending_guidebooks": 239, "total_guidebooks": 962, "blurbs": ["Coffee shop and vegetarian restaurant. Very Austin. Sit outside or in. Great food. \"Even chronic carnivores find something to love at this laid-back cafe catering to vegetarians (and vegans) with options ranging from salads to tacos to sandwiches, plus a gluten-free menu, coffees and juices served from breakfast through late-night. The funky, space and dog-friendly patio draw everyone from parents to hipsters.\"~Zagat", "A culinary sanctuary for vegetarians and vegans, Bouldin Creek Coffee House serves up a variety of tasty dishes that will please even the most devoted meat eaters as well!  My go-to dish is the Renedict (served until they run, typically around 1 pm) I get it on a hashbrown with tofu scramble and a side of Chipotle Pecan Pesto. INSANELY good! Try the Tokyo Fog as an after dinner beverage. www.bouldincreekcafe.com  ", "A classic local favorite, Bouldin Creek Cafe has an all-vegetarian menu that is boasting with originality and flavor. From their coffee drinks to their draft beers to their sweet and/or savory meal options that last all day and night, Bouldin has something for everyone. We highly recommend it, but be prepared to wait if you go at peak brunch time. You can always order a drink at the bar while you wait."]}, {"name": "Central Market", "neighborhood": "Central Austin", "google_place_id": "ChIJeenpoTlLW4YRgkIYCgGh17E", "lat": 30.2312, "lng": -97.797161, "category": "store", "category_guidebook": "Tried + True", "rec_count": 16307, "recommending_guidebooks": 281, "total_guidebooks": 2034, "blurbs": ["Central Market is known for its Café on the Run. The chain also carries a line of exclusive organic products called Central Market Organics. The product line includes organic or all-natural items ranging from commodities such as milk and eggs to pasta sauce and cookie dough. Central Market deliberately limits floor space allocated to packaged products, allowing more space for fresh produce, meat and seafood, bulk products, and chef-prepared items. The produce section stocks items such as crab-ap", " Where Foodies celebrate every day. What makes Central Market one of the freshest markets in the country? Try a sumptuous selection of everything edible, for starters. We go straight to the source to bring you some of the finest foods Texas and the rest of the world have to offer. With hundreds of cheeses, thousands of wines, acres of produce, and aisles of experts, Central Market is for everyone really into food.   Unmatched selection of domestic and imported goods, and celebrations of differen", "South Austin has a paucity of grocery stores, but aside from Whole Foods downtown, Central Market is your best bet. It's an offshoot of H-E-B, the dominant grocery store chain in most of Texas, but with a decidedly more upscale flavor, roughly halfway between H-E-B and Whole Foods. Much like the latter, it features a wide variety of gourmet and ready-made foods, along with a huge beer and wine selection. Much like the former, its staples are available at unbeatable prices. (Pro tip: the Central "]}, {"name": "Jo's Coffee", "neighborhood": "South River City", "google_place_id": "ChIJ1S_Bov20RIYRe7MiR8tYawY", "lat": 30.251020431518555, "lng": -97.7493896484375, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 5172, "recommending_guidebooks": 232, "total_guidebooks": 962, "blurbs": ["What's special about this place is that there is a mural on the side of the coffee house. This mural is my favorite in all the world. This coffee house was opened by a lesbian couple in 1999. One night the couple got into a big fight. One girl wrote a message with paint on the side of the coffeehouse wall. She was hoping her girlfriend would see it the next morning whenever she came to open shop. What did that message say? It was simple \"I love you so much.\" Now the couple is married and still r", "Stop for a cup of coffee here and enjoy a popular photo opp by their \"I love you so much\" mural 1300 S. Congress Ave. In the heart of the South Congress (SoCo) entertainment district and located on the side of Jo’s Coffee - known for its sweet Iced Turbo coffee, mouthwatering tacos and unparalleled people-watching - the “I love you so much” mural is perhaps Austin’s most well-known. In fact, this simple yet timeless message attracts such a following that there’s sometimes a line to take a pictur", "Jo's coffee is right across the street from the complex, with outstandingly delicious coffee (I especially love their cold brew!) and great people watching in a quintessentially \"Austin\" outdoor setting. Sometimes there's a bit of a line, but completely worth it!  As a bonus, snap a picture in front of Austin's famous \"I love you so much\" mural on the side of the building."]}, {"name": "Veracruz All Natural Food Truck", "neighborhood": "East Austin", "google_place_id": "ChIJ5TnXj7O1RIYR1QQH8J_paW8", "lat": 30.257699966430664, "lng": -97.72566223144531, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 2601, "recommending_guidebooks": 245, "total_guidebooks": 2431, "blurbs": ["(One mile from the suite) Award-winning local food truck favorite bordering one of the large outdoor patios at Radio Coffee and Beer, just up the street. Has won Austin Chronicle's Best TexMex multiple years in a row for its fresh, affordable tacos and Mexican fare. See also Radio Coffee and Beer, an iconic popular South Austin cafe, bar, music venue and remote work / meet up space with indoor seating as well as multiple outdoor covered and open patios (dog friendly) and award-winning onsite foo", "Veracruz All Natural sets itself apart from the city's other taco slingers thanks to super fresh ingredients. The Migas taco has a cult following, and for good reason; the fresh tortilla stuffed with eggs, tortilla chips, avocado, pico de gallo and cheese will make you a fan too. Try a fresh aqua fresca to complete your breakfast, and you’ll see why they’ve earned a loyal following.  There are many locations around town, by the Tarrytown location is our favorite - but check hours as they close e", "Veracruz tacos are the things of Austin legend-- homemade corn tortillas, fresh ingredients, and the perfect smooth green salsa with a kick. For breakfast, I love their migas taco and for lunch, a chicken quesadilla ALWAYS hits the spot. They also have fresh squeezed juices so your meal will qualify as healthy! Last thing of note, this space has a lovely outdoor seating area with a beautiful big tree shading the tables and chairs. Order online on weekdays and order at the truck Friday - Sunday."]}, {"name": "East Side Pies", "neighborhood": "East Austin", "google_place_id": "ChIJtzhgdLm1RIYRurjhELzKvYU", "lat": 30.268768310546875, "lng": -97.72408294677734, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 3468, "recommending_guidebooks": 234, "total_guidebooks": 2431, "blurbs": ["Type of Food: Thin crust pizza\t  New York-style pizza with big slices that makes us SO happy to live in the neighborhood.  We have never had a bad pizza here, this is our number one go-to pizza place. They have take-out, delivery, or pick-up. There is some outside seating and you can order by the slice.  All of their vegetables come from local, urban farms, and on a really good day, their Margarita pizza (they call it “The Marge”), comes with heirloom tomatoes for those who ask nicely.   Address", "One of Austin's favorite pizza joints (perhaps a close second to Home Slice).  If you love New York-style pizza this is your place.  The crust doesn't get thinner and the toppings range from the classics to combinations you never knew could be so good.  There isn't much seating, so plan on getting it to-go or for delivery.", "http://eastsidepies.com/  What is an East Side Pie? A thin crispy crust pizza, fully loaded with homemade goodness. Most of our toppings are locally sourced from farms and ranches in central Texas. We make our own sauces, meatballs, and sausages. Come try our homemade chimichurri or squash sauce slices at ESP 1 (Rosewood)"]}, {"name": "Elizabeth Street Cafe", "neighborhood": "South River City", "google_place_id": "ChIJWyfc5uK0RIYRq5-s4p2EOkc", "lat": 30.249805450439453, "lng": -97.75467681884766, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 3016, "recommending_guidebooks": 216, "total_guidebooks": 962, "blurbs": ["Elizabeth Street Café is a neighborhood Vietnamese cafe and French bakery in South Austin opened in December 2011. The little restaurant boasts sunny dining rooms and a shady garden patio and serves fresh breakfast, lunch and dinner as well as takeout.  Elizabeth Street Café is known for: great croissants & Stumptown coffee, bánh mì served on house baked baguettes, fresh spring rolls, Kronenberg on tap, steaming bowls of pho, spicy curries, house cocktail & fruity boozy punch, fun kids menu, and", "Elizabeth Street Café is a neighborhood Vietnamese cafe and French bakery in South Austin opened in December 2011. The little restaurant boasts sunny dining rooms and a shady garden patio and serves fresh breakfast, lunch and dinner as well as takeout. Elizabeth Street Café is known for: great croissants & Stumptown coffee, bánh mì served on house baked baguettes, fresh spring rolls, Kronenberg on tap, steaming bowls of pho, spicy curries, house cocktail & fruity boozy punch, fun kids menu, and ", "Love, love this place!  Elizabeth Street Cafe is the brainchild of Thomas Moorman and Larry McGuire. This quaint cafe, restaurant and bar offers Vietnamese and French delights. Reminiscent of French Colonial Hanoi, it has a lovely landscaped garden and vibrant interiors that are decked with artworks and antiques. Savor their spicy curries, pho, pastries and baked goodies. Enjoy their happy hours with a choice drink."]}, {"name": "Haymaker", "neighborhood": "East Austin", "google_place_id": "ChIJf0ia8-y1RIYR-xO1mwc4hpo", "lat": 30.28482, "lng": -97.717619, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2794, "recommending_guidebooks": 223, "total_guidebooks": 2431, "blurbs": ["Sports Bar with TVs and good food  A couple of reviews say it all  Can we just talk ab this place for a second??? Omggg! The vibes! Total sports bar with TV's inside and outside. Dog-Friendly! Lemme just say... Being from Wisconsin, we appreciate all of the WI menu items. We've tried so many pretzels 🥨 in Austin and these pretzel tots taken the cake! The beer cheese was perfection and paired perfectly! Kettle chips = a homemade delight! We loved everything about this place. Our service and food ", "We’ve always loved the simple, neighborhood bars of the Midwest and northeast. They’re there to serve the neighborhood – any and all. We took that accessible attitude and put it toward Haymaker. We serve simple, hearty food: Poutine and Comfort Sandwiches. Big, burly comfort sandwiches inspired by our favorite spots around the country. And tons of Craft Beer. It’s comfortable. We have TVs if you like sports, but we’re not a sports bar. We’re the kind of place you can go to a few times a week. We", "Haymaker is the main sports bar within easy walking distance. Food is good and drinks are fine, but service is often hit or miss. That being said, it is super fun to watch sports there and they have suppoters groups for (at least) UT, Michugan, Chelsea, Man City, FC Austin, and US Soccer. Just be warned, if it is a big game, you have to get there early! "]}, {"name": "Perla's", "neighborhood": "South River City", "google_place_id": "ChIJb7byD_20RIYRT9uoSeSUvzY", "lat": 30.249958086414498, "lng": -97.75009144588012, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2499, "recommending_guidebooks": 214, "total_guidebooks": 962, "blurbs": ["Perla’s was founded in the Spring of 2009 by chefs Larry McGuire and Tom Moorman Jr. with the goal of establishing a great oyster bar & seafood joint on beloved South Congress Avenue. Perla’s offers fresh fish and oysters flown in daily from both coasts with an emphasis on sourcing from the Gulf of Mexico and simple, clean preparations. The bar makes delicious coastal cocktails and the wine list is stocked with fun sparkling, rosé & white wines.  Perla’s has Austin’s prettiest oak-shaded patio a", "Austin doesn't have a lot of amazing Seafood restaurants but this one is at the top.  Expect to spend some money here but you can't go wrong with anything you order.  You can also do some serious people watching on the patio here! You never know who you might see walking by.  If you don't want to drop a lot of dough, go sit on the patio at Happy Hour for the Oysters - they speak for themselves!", "Phenomenal oyster and seafood joint with plentiful outdoor seating and a great bar inside. You need a reservation, though if you go early, you can put your name on the list and then walk South Congress for an hour or two. (South Congress is home to tons of shops and great sightseeing + photo ops such as the famous \"I love you so much\" sign by Joe's Coffee).  "]}, {"name": "Cherrywood Coffeehouse", "neighborhood": "East Austin", "google_place_id": "ChIJscwUlfO1RIYRmKPeAAr1Zts", "lat": 30.293533325195312, "lng": -97.71601104736328, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 2453, "recommending_guidebooks": 221, "total_guidebooks": 2431, "blurbs": ["This is much much more than a coffeehouse. They have a full kitchen and serve a wide variety of  sweet and savory options. They have lots of indoor seating and a really big garden area with outdoor seating. I don't thin I have ever sat inside because the garden is just so nice.  You order at the counter, take a number and they will deliver the food to your table. The coffee works a bit differently. You have to pick it up. So either leave someone behind to wait for it or check back in after 5 min", "This is a great place to eat breakfast lunch or dinner. Sandwiches are pressed with butter on the grill. Yum. Eat fries. They have queso now and add avocado without emptying your pocket book! Cherrywood has 20+ rotating drafts on tap to choose from and they also serve Ladybird coffee bombs to add to your favorite coffee drink. (Happy hour is from 3pm to 7pm daily.) Open till midnight. Dog friendly patio. ", "A quick walk! Not just a coffee shop, this place has real roots in Austin and is great for it's outdoor atmosphere, beer selection, and a full menu with filling breakfasts, great burgers, tacos and po-boys. (.3 mile walk from the house) $ "]}, {"name": "Dai Due", "neighborhood": "East Austin", "google_place_id": "ChIJsx9cWey1RIYRpeZVdPR4YtA", "lat": 30.284849166870117, "lng": -97.71675872802734, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 2607, "recommending_guidebooks": 228, "total_guidebooks": 2431, "blurbs": ["Restaurant and local butcher shop.  Finest ingredients.  About our Ingredients  We only use food that we can find in our region, so the bounties and scarcities of the seasons are always the theme; we have asparagus for three or four glorious weeks, look forward to the apples in August, and are grateful when we are blessed in the rare year that apricots arrive. We marvel at fall flounder, lament using our last potato for a few months, and miss our South Texas lemons when they disappear in the Spr", "Dai Due is truly amazing, but it's also not for everyone.  So I recommend looking them up online and reading more about them to see if it suits you.  It's fairly pricey, but we've never experienced a place as committed to the responsible and self-sufficient sourcing and preparing of food, and of cooking with integrity as Dai Due.  The restaurant (and butcher shop) grew out of a philosophy, and they’re quite serious and sincere about it.  Serious foodies hold this place in high esteem.  They do h", "World renowned Owner/Chef Jesse Griffiths has done it right with his Farm-to-table fare from locally sourced ingredients served in a rustic space with onsite butcher shop. About: Dai Due was created in 2006 to reconsider what “our” food is and will be.  By using ingredients that are present in our region, we are able to serve foods that are fresher, buy food that is produced in a fair and equitable way, represent local culinary traditions, and support farmers and ranchers who are striving to imp"]}, {"name": "Thunderbird Coffee", "neighborhood": "East Austin", "google_place_id": "ChIJ2VQltuy1RIYRKhsPk6k9JaA", "lat": 30.28441619873047, "lng": -97.71939849853516, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 2453, "recommending_guidebooks": 214, "total_guidebooks": 2431, "blurbs": ["We have two wonderful coffeeshops, each two blocks away from our house in opposite directions, Bennu Coffee and Thunderbird Coffee.  We love them both, here's how they differentiate:  Bennu has the kindest staff and the most heart, and the environment, while warm and friendly, is geared towards focus and work.  It's usually filled with grad students. We'd rate the coffee drinks a solid A-minus.  Thunderbird is a little more hipster, a little more of a scene, and more socially oriented, with a mo", "My favorite coffee spot up in Cherrywood. I love this little neighborhood, so I'll venture all the way up here often just for their coffee + breakfast tacos (early enough before they sell out). I'll also tack on a visit to Nature's Treasures Texas to buy some crystals... in case you're into that kind of thing, too. ", "Thunderbird is a locally owned café in Austin, Tx. We have two locations in great neighborhoods, Cherrywood (East Austin) and Brentwood/Crestview (North Central). We specialize in high-quality direct-trade coffee and fine craft beers. We also have a great selection of snacks and light fare."]}, {"name": "Hopdoddy Burger Bar", "neighborhood": "South River City", "google_place_id": "ChIJK7_q__y0RIYRA9j-Q5KFOP0", "lat": 30.249765396118164, "lng": -97.7501220703125, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 9660, "recommending_guidebooks": 220, "total_guidebooks": 962, "blurbs": ["Hopdoddy Burger Bar is a popular Austin eatery known for its gourmet burgers, craft beers, and creative shakes. With locations across the city, Hopdoddy combines high-quality, fresh ingredients with a laid-back atmosphere to serve up mouthwatering burgers like the Primetime and Classic. The restaurant is also famous for its hand-cut fries, crispy onion rings, and innovative milkshakes, making it a go-to spot for casual, yet elevated dining. Whether you’re grabbing a quick bite or enjoying a meal", "While Hopdoddy isn't exclusive to Austin, this is the first one we'd ever been to. With a line that can extend around the building, and plenty to do around SOCO before or after you've eaten, this burger spot is a local favorite and a must-visit. There are burger options for all (classic, specialty, and veggie), a great draft beer selection (if you like IPAs, go for the Conspiracy Theory), and their Parmesan Truffle Fries are incredible (invest in an extra Truffle Aioli sauce) or if you're feelin", "A South Congress favorite. Prepare for long lines, especially Thur-Sun.  But while in line you meander passed the bar area and can get a draft beer served to you while you wait to order.  Or the vodka limeade is great after a hot day.  They serve amazing burgers and crafty nutella and pretzel milkshakes.  Sarah’s favorite is the spinach and arugula salad. (Full disclosure: that's all she ever gets!) "]}, {"name": "Caffe Medici", "neighborhood": "Central Austin", "google_place_id": "ChIJg74uwmu1RIYRvyBInvYoBiE", "lat": 30.27951431274414, "lng": -97.75941467285156, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 4116, "recommending_guidebooks": 214, "total_guidebooks": 2034, "blurbs": ["While Austin has a huge variety of indie coffeehouses, Caffe Medici is one of the best, and arguably *the* best, especially for latte. It's about a block south of Jeffrey's, and also within easy walking distance of my place. It's also the original location in what's become a small chain, and usually busy throughout the day; it's one of the more popular places in town to hang out and work on a laptop.", "This is one of my favorite coffee shops in Austin. It is set in a small house and it has a nice cozy/stylish feel. This is a perfect spot for weekend early birds, its usually packed later in the morning on weekends. I like this place best early on a weekday morning. Definitely recommend their mocha or cappuccino. ", "Caffe Medici (usually just called \"Medici\") has long had some of the best espresso-based coffee drinks in Austin, and I was very pleased to discover one had opened so close to my place! They offer top-notch lattes in particular, and during mornings they also sell breakfast tacos from Tacodeli, a local fave."]}, {"name": "Barton Springs Municipal Pool", "neighborhood": "South River City", "google_place_id": "ChIJXVdJjDq1RIYRuahMgBpqoeQ", "lat": 30.264353886395558, "lng": -97.77054487846853, "category": "point_of_interest", "category_guidebook": "Tried + True", "rec_count": 20673, "recommending_guidebooks": 307, "total_guidebooks": 962, "blurbs": [" The grand dame of Austin swimming spots. This spring fed oasis looks more like a lake than a pool and at 900 ft in length the laps can take a while. Barton Springs Pool is actually located right in the middle of the original Barton Creek but it is filled by crystal clear spring water that flows from distant hill country through a fractured limestone aquifer. Did I mention the the water is “refreshing”—hovering somewhere between 68-70F year round it can feel glacial on a hot summer day and like ", "Within Zilker Park's 358 acres lies one of the crown jewels of Austin - Barton Springs Pool. The pool itself measures three acres in size, and is fed from underground springs with an average temperature of 68-70 degrees, ideal for year-round swimming. Over the years, Barton Springs Pool has drawn people from all walks of life, from legislators who have concocted state laws there to free-spirited, topless sunbathers who turned heads in the 1970s. Robert Redford learned to swim at the pool when he", "Within Zilker Park's 358 acres lies one of the crown jewels of Austin - Barton Springs Pool. The pool itself measures three acres in size, and is fed from underground springs with an average temperature of 68-70 degrees, ideal for year-round swimming. Over the years, Barton Springs Pool has drawn people from all walks of life, from legislators who have concocted state laws there to free-spirited, topless sunbathers who turned heads in the 1970s. Robert Redford learned to swim at the pool when he"]}, {"name": "Blue Dahlia Bistro", "neighborhood": "East Austin", "google_place_id": "ChIJEZhJBbu1RIYRndXxs0s-AZg", "lat": 30.268848419189453, "lng": -97.72872924804688, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 2023, "recommending_guidebooks": 214, "total_guidebooks": 2431, "blurbs": ["Lovely French bistro in an historic building on the Square. Friendly servers put hard-core coffee in front of you while you listen to soothing tunes sung in that language everyone loves but no one understands. Breakfast is served all day here, making this a great brunch spot no matter how rotten you are at staying on schedule. You can go short with a strawberry cream cheese or chocolate hazelnut croissant, or go long with a frittata, French crepes, Belgian waffles, blintzes….you know what? Just ", "We love this affordable yet amazing French cafe!  We recommend going for brunch and ordering their fantastic $2 mimosas (pomegranate is my personal favorite), the blueberry blintzes,  and the Parisian sandwich with dill cream cheese. They also have delicious salads and vegetarian options. Top off your meal with a perfect cappuccino or their fluffy  macarons.", "You must like onions to enjoy this place.  I love their happy hour and half price menu! Good coffee and a lovely place for breakfast or lunch...dinner is good too.  Cheese plates, wine, tea, coffee.  There is a sweet back yard and there is also seating outside in the front.  "]}, {"name": "Magnolia Cafe", "neighborhood": "South River City", "google_place_id": "ChIJf4kFMPu0RIYR96Fyje5TjLs", "lat": 30.244476309467306, "lng": -97.75197594204705, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 5577, "recommending_guidebooks": 195, "total_guidebooks": 962, "blurbs": ["Magnolia Cafe is an Austin staple; you absolutely must go! It's open 24 hours. If you're out late, go get their MagMud--a queso mix with black beans, avocado, pico de gallo and jalapenos. Yum! If you're going for brunch, try their buttermilk pancakes or their Flamingo omelette with verde and sour cream sauces.  **Make sure to check their specials board when you go; you never know what gems they have just waiting to be tried.", "Just down the street from Allens is the South Congress location of Magnolia Cafe, known for its “Sorry, We’re Open” neon sign and 24-hour diner service. The original location opened as Omelettry West on Lake Austin Boulevard in 1979, and this beloved café has been an Austin favorite ever since. Barack Obama’s 2014 visit cemented the diner’s status as a local icon forever when he met a UT student for coffee there.", "The indispensable restaurant is Austin’s brunch hero, doling out pancakes, omelettes, migas, and lunchtime dishes all day and night lunch. Pickup orders can be placed online. The restaurant has reopened for dine-in service, and there is outdoor seating available. While pre-pandemic, the restaurant had been open 24/7, its new hours are from 8 a.m. to 10 p.m. every day. Be prepared to wait in line for this gem!"]}, {"name": "Güero's", "neighborhood": "South River City", "google_place_id": "ChIJ14gY_Py0RIYRUTA0uLXWlEw", "lat": 30.249146920459758, "lng": -97.75028092442054, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2082, "recommending_guidebooks": 192, "total_guidebooks": 962, "blurbs": ["Everybody from your toddler niece to your 80-year-old grandfather will love Güero’s Taco Bar. Sizzling hot fajitas, traditional tex-mex tacos, crave-worthy queso, undeniably delicious margaritas, and more, Güero’s has it all. Whether you sit inside in the main room, or outside on the rustic patio, your experience will be a good one. You definitely don’t want to miss out on the live music in their Oak Garden every Wednesday-Sunday! Check out their website for each week’s lineup.", "An Austin institution, Gueros is a lively tex mex restaurant with nearby fun shops on South Congress. This makes for a fun dining, then shopping outing. They have a salsa bar & hand-shaken margaritas in a landmark building with a patio.   Pro tip: sit on the patio, order a margarita and some chips and salsa while listening to live music coming from their outside ampitheater next door (Guero's On Stage). List of upcoming bands and musicians:  https://gueros.com/#on-stage", "Wednesday nights, Guero's hosts Sun Radio, a locally owned radio station that supports live music and musicians. There are usually two live music acts, starting at 6:00 p.m. Margaritas, Mexican beers, tequila shots and really good live music! They serve tacos and tamales, with free chips and salsa, all under some big Live Oak trees. It's truly fabulous, I can't recommend highly enough. Their restaurant indoors is always bustling, too! "]}, {"name": "Contigo", "neighborhood": "East Austin", "google_place_id": "ChIJfVS3YOO1RIYRa4mDmjrSoPQ", "lat": 30.287839889526367, "lng": -97.70343780517578, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 3060, "recommending_guidebooks": 204, "total_guidebooks": 2431, "blurbs": ["Contigo offers flavorful New American cuisine. The ribeye steak and tempura green beans are out-of-this-world. Don’t forget to try the fried avocado. One of my favorite spots for a date night, or to sit around the fire pit and make new friends￼. ", "This is fantastic spot to go right before a night on the town when the weather is nice! Farm-fresh Texas fare meets seasonal cocktails & beer, plus a large all-weather patio. Amazing outdoor seating area with eclectic food and great cocktails.  ", "Contigo the minimalist beer garden is the perfect setting for its menu, heavily featuring charcuterie and other meaty dishes. It's the perfect example of Austin in restaurant form found right in the MLK neighborhood."]}, {"name": "The Liberty", "neighborhood": "East Austin", "google_place_id": "ChIJ01xUKre1RIYRM_3DzIyLPT0", "lat": 30.262855, "lng": -97.725001, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2000, "recommending_guidebooks": 203, "total_guidebooks": 2431, "blurbs": ["The Liberty is one of the oldest bars on East 6th and while the warehouses that once surrounded it have been replaced by condos, it’s still one of the best places to drink on the street. Inside you can play pool or post up around the bar, or you can head to the backyard and grab a spot at one of the many picnic tables. Location of the ORIGINAL East Side King Thai street food trailer - get the LIFECHANGING fried chicken and the Brussels , liberty rice and beets and you’ll be set. ", "Great bar, good prices, friendly staff, good beer selection and full bar including featured cocktails. East Side King food trailer in the backyard has excellent, Asian-fusion food including vegetarian options. Communal picnic table seating in the backyard, as well as indoor seating.", "This is a totally decent bar.  Good service, nothing fancy, good crowd, nice open area out back with a food trailer from East Side King which is totally delicious (try the beet fries if you like beets... or even if you just don't hate beets.  They're really good) "]}, {"name": "Bennu Coffee", "neighborhood": "East Austin", "google_place_id": "ChIJDbXf03G1RIYROhj9Cwwv600", "lat": 30.27979850769043, "lng": -97.7195816040039, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1970, "recommending_guidebooks": 198, "total_guidebooks": 2431, "blurbs": ["We have two wonderful coffeeshops, each two blocks away from our house in opposite directions, Bennu Coffee and Thunderbird Coffee.  We love them both, here's how they differentiate:  Bennu has the kindest staff and the most heart, and the environment, while warm and friendly, is geared towards focus and work.  It's usually filled with grad students. We'd rate the coffee drinks a solid A-minus.  Thunderbird is a little more hipster, a little more of a scene, and more socially oriented, with a mo", "Open 24/7, fun and funky with great coffee.  Decorated with what appears to be leftover office furniture and shabby couches, this place always attracts a crowd.  Free wi-fi and power outlets everywhere.  Any time of day or night you'll find students of all ages studying, socializing and sipping java.  Has breakfast tacos, pastries, light bites and cold drinks too.", "This place is quirky and sits right in front of a famous Austin mural \"You're My Butter Half\". It is also conveniently open 24 hours so even if you have those late nights or super early mornings you can be sure that this place will deliver. "]}, {"name": "Micklethwait Craft Meats", "neighborhood": "East Austin", "google_place_id": "ChIJB0cJf7m1RIYRLWbiT_M6QXM", "lat": 30.268451690673828, "lng": -97.72531127929688, "category": "restaurant", "category_guidebook": "Local Signature", "rec_count": 1746, "recommending_guidebooks": 193, "total_guidebooks": 2431, "blurbs": ["Our favorite barbecue in Austin, and a fraction the waiting time you'd find at the famous Franklin Barbecue. If you've never liked grits, the jalapeño-cheese grits there may change your mind, and you've never had grits, you can't beat theirs as an introduction. I've never liked cole slaw, but I'm a huge fan of theirs. Everything is made in-house, down to the bread, sauce, desserts, and pickles.  It's all fantastic, but their specialty is sausage (different kinds every day), and the pork shoulder", "Micklethwait stands with the top tier of pitmasters in terms of quality, but also differentiates themselves by focusing on their sausage offerings and taking a more artisanal approach to their menu. The trailer serves homemade bread, and often has off-menu specials like pork chops or esoteric sausages. The trailer has recently expanded their hours -- you can actually get dinner service -- and also sports some excellent side items and dessert offerings, assuming you can find the room.", "Micklethwait Craft Meats: https://www.craftmeatsaustin.com Location: East Austin (Thurs - Sun only) Distance: 5 mins by car  One of the better BBQ joints in town (Top 3). Its food trailer located down the street from the famous Franklin's BBQ but doesn't have the 3-hour line. Opens at 11am and suggest arriving 15mins before it opens - likely a few people in line already. You can't go wrong here and they will sell out by 1:30pmish."]}, {"name": "The Buzz Mill", "neighborhood": "East Riverside - Oltorf", "google_place_id": "ChIJTzmFkkW0RIYRZhkrPHixqNA", "lat": 30.241753, "lng": -97.726903, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1912, "recommending_guidebooks": 167, "total_guidebooks": 514, "blurbs": ["The Buzz Mill is an incredible local spot!! If you go, you must get the Honey Badger with Oat Milk.  It's become an obsession of ours and part of our morning routine!  It is a 24-hour spot that provides coffee, food, and spirits!   It's also a very cool community-driven brand that's sole purpose is to cultivate the community around it...From building gardens,  cleaning rivers to creating a place where people can interface with their community in new ways.  When you shop here you are helping the ", "This place has a little bit of everything. It's a lumberjack themed coffee shop and bar known for their coffee, infused whiskeys and lumberjack decor. This is a great place to drink with friends or study in the private study hall. You can expect to find  a few food trailers outside as well serving up BBQ and cheeseteaks with a great outdoor ambiance. They are also open every day around the clock!", "Buzzmill is the ultimate vegan destination for those who love good food, good drinks, and a good time. This trendy cafe and bar is known for its delicious coffee, and craft beers which make it the perfect spot to fuel up and unwind. But Buzzmill is more than just a place to grab a bite – it's also a hub of entertainment, with live music and other events happening regularly. "]}, {"name": "JuiceLand", "neighborhood": "East Austin", "google_place_id": "ChIJdfyEGRi1RIYRfd4mPmBtyIU", "lat": 30.26242446899414, "lng": -97.76251983642578, "category": "restaurant", "category_guidebook": "Tried + True", "rec_count": 5060, "recommending_guidebooks": 207, "total_guidebooks": 2431, "blurbs": ["Google: “..fountain of freshness in a world of fast food, featuring fresh juices superfood smoothies and delicious gluten-free to go salads.”  Vinai’s Top Three: - WUNDERSHOWZEN (almond milk • banana • spinach • hemp protein • peanut butter smoothie) - ORIGINATOR (fresh apple juice • banana • blueberry • cherry • peanut butter • brown rice protein • fl ax oil • spirulina smoothie) -VEGETABLE KINGDOM (fresh apple juice • mango • cherry • carrot • spinach • beet • lemon • spirulina) ", "This place is quintessential Austin! It is what all juice bars should aspire to be! The possibilities are endless, and if its not already on the menu, they will customize anything you request! It is a great place to pick up healthy eating options on the go. Try their Honey Beary smoothie, sip coconut water out of  a fresh young coconut, and play a arcade pac man game on the house! Browse their extensive record album collection. Feeds  and energizes both the body and the soul!", "Juices and Smoothies, that's all they do.  And they're a bit pricey, in my humble opinion.  But they're also really good top-quality smoothies.  So if you’re feeling like treating yourself to a little extravagance . . . or, I’ll say it, if you’re a little hung-over and in need of some nutritional recharge (or some “brain juice for papa” as our daughter says) . . . then JuiceLand is totally worth the indulgence. "]}, {"name": "Figure 8 Coffee Purveyors", "neighborhood": "East Austin", "google_place_id": "ChIJk-YOCri1RIYRiu30qDjUFQ4", "lat": 30.26691436767578, "lng": -97.7199478149414, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1566, "recommending_guidebooks": 184, "total_guidebooks": 2431, "blurbs": ["This great Café doesn’t have the serious atmosphere that many Austin coffee shops give off, but the coffee is nothing to joke about. For example, the La Marzocco Italian espresso machine practically lights up the place. The coffee shop features roasters from Portland and San Francisco in addition to local roasters such as Tweed and Wild Gift. The friendly service attracts musicians, DJs and anyone wanting a great cup of coffee. Pastries are the only food option on the menu, but there's plenty of", "Figure 8 is a quaint coffee shop nearby. The owners roast their coffee on site, it is the best in town! Don't forget to grab a breakfast taco or pastry that the shop sources from a bakery up the street!", "Great place if you're looking for a quiet place to enjoy your coffee or just wanting to grab something tasty to-go. They serve pre-made breakfast tacos and pastries if you're looking to grab a bite too."]}, {"name": "Mi Madre's Restaurant", "neighborhood": "East Austin", "google_place_id": "ChIJ9Zeruey1RIYRkrfwh9Rb9Rk", "lat": 30.284137725830078, "lng": -97.71892547607422, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 1870, "recommending_guidebooks": 172, "total_guidebooks": 2431, "blurbs": ["We love Mi Madre’s.  They're family owned and operated, and they’re sweethearts.  The place is super casual and easy-going.  The menu is pretty run of the mill Texmex, and nothing on the menu is bad, but also nothing on the menu stands out as especially outstanding.  We eat there a lot cause we love the place more than we especially love the food.  Tip: Their Chicken Rito Burrito is my favorite thing on the menu.  The diablo sauce, which comes on the side, is very flavorful, and also legit spicy", "Mi Madre's is a great choice if you want someplace to sit, some people want breakfast tacos and some people want a bigger plate, or if you slept in a bit and want a mix of breakfast and lunch options.  Protips: - Order the huevos rancheros! So good  - They have a full bar  - The Café de Olla or the Cafechata or fun coffee drinks  - They outdoor patio is great. It's right across from a beautiful neighborhood garden  Walk time: 5 mins Drive time: 2 mins", "Aurelio and Rosa Torres opened their doors and hearts to Austinites in 1990. What started as a 10 seat “taco shop” has evolved into a wonderful restaurant serving the finest Tex-Mex cuisine. The restaurant has been renovated twice, and now offers two dinning rooms, a beautiful patio and quick to-go area. Mi Madre’s has become an East Austin favorite with a very loving and loyal clientele"]}, {"name": "Yellow Jacket Social Club", "neighborhood": "East Austin", "google_place_id": "ChIJgS3Mxba1RIYRn89uoQtahTY", "lat": 30.261636, "lng": -97.724832, "category": "bar", "category_guidebook": "Local Signature", "rec_count": 2088, "recommending_guidebooks": 180, "total_guidebooks": 2431, "blurbs": ["A little bit Austin punk, a little bit neighborhood hang. Yellow Jacket has that unpolished, Eastside edge — but with genuinely great food (don’t skip the burgers) and one of the more relaxing green patios around. The outdoor space is full of trees and shade, making it just as good for a slow afternoon beer as it is for an easy night out. Casual, local, and comfortably cool.", "Hidden under a bunch of trees in front of some train tracks on a side street, you’d probably never know Yellow Jacket Social Club was here. This divey spot isn’t just a great place for a low-key hang in the shade, though, they also serve a surprisingly great brunch. Start the day off with a frozen mimosa and the shrimp and grits and see where the afternoon takes you.", "Hidden under a bunch of trees in front of some train tracks on a side street, you’d probably never know Yellow Jacket Social Club was here. This divey spot isn’t just a great place for a low-key hang in the shade, though, they also serve a surprisingly great brunch. Start the day off with a frozen mimosa and the shrimp and grits and see where the afternoon takes you"]}, {"name": "Lazarus Brewing Co.", "neighborhood": "East Austin", "google_place_id": "ChIJlZhRW7a1RIYR5xxRXpc_6tM", "lat": 30.261737823486328, "lng": -97.72200775146484, "category": "cafe", "category_guidebook": "Local Signature", "rec_count": 1970, "recommending_guidebooks": 187, "total_guidebooks": 2431, "blurbs": ["Having lived in London, I call this \"My Regular\". Cozy brewery for house beers sold only on-premise and to-go, plus wine, kombucha, espresso & house tacos. Legit tacos, guacamole all day. SINFUL queso fundido.   The living room area feels like a British pub with couches, board games, books. The walls open up garage-style for indoor/outdoor fluidity. Misters and fans for the outside seating.   Dog friendly, authentic staff who enjoy their jobs and each other and will likely remember your name. Lo", "Must see for beer aficionados! This brewery is one of if not the best in town, and because they don't distribute, they get much less credit than they should. As a fan of good craft beer, I haven't seen a place in Texas yet that is able to make really excellent versions of so many different styles. Very relaxed atmosphere and outdoor area. Chill enough that bar tenders may not even ask for your ID -- according to Texas law, they can just ask you to confirm you're 21, and given the maturity of the", "This our favorite microbrewery in the immediate neighborhood! They have limited small bites menu along w a large beer selection. They opened in late 2016 and the ambiance is warm and wonderful. This is larger than Zilker brewing and a bit busier, but has many more inside and outside options w several seating options.    Address/Phone: 1902 E 6th St, Austin, TX 78702 Website: www.lazarusbrewing.com Price Range: $5-7 pints of beer, small bites $6-12 per app.  Walking Distance: 15-minute walk"]}, {"name": "Mueller Lake Park", "neighborhood": "East Austin", "google_place_id": "ChIJKYtScPm1RIYR3XNM9fOKrMY", "lat": 30.297768545917, "lng": -97.707086892054, "category": "park", "category_guidebook": "Tried + True", "rec_count": 3516, "recommending_guidebooks": 187, "total_guidebooks": 2431, "blurbs": ["Mueller is a mixed-use, master-planned community located just three miles from downtown Austin. It is known for its walkability, green spaces, and sustainable design, with a mix of residential, commercial, retail, and recreational areas.  Transportation: Mueller is designed to be a walkable and bike-friendly community, with an extensive network of sidewalks, bike lanes, and trails.
